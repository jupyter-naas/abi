# Dependency updates, checked weekly.
#
# Rules, the same for every ecosystem:
# - minor and patch bumps come together in one grouped pull request per
#   ecosystem and directory (a rule with `directories` opens one per directory);
# - a major bump comes alone, in a pull request of its own (it is in no group);
# - a release is held back until it is a week old (cooldown), so a bad or
#   compromised release has time to be pulled before it reaches us;
# - open-pull-requests-limit caps how many version-update pull requests stay
#   open at once per ecosystem; once one is merged or closed, the next opens at
#   the following weekly run. It does not cap security-update pull requests.
#
# Python is updated through `uv` (each directory holds a pyproject.toml and its
# uv.lock): the `pip` ecosystem would bump pyproject.toml and leave uv.lock behind.
#
# Dependabot reads this file from the default branch only. Security updates
# (known CVEs) also need "Dependabot security updates" on in the repository
# settings; the groups below apply to version updates only.
version: 2

updates:
  - package-ecosystem: uv
    directories:
      - /
      - /libs/naas-abi-idp
      - /libs/naas-abi/naas_abi/apps/nexus/apps/api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /libs/naas-abi/naas_abi/apps/nexus
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /.deploy/docker/images
      - /docker/images
      - /libs/naas-abi/naas_abi/apps/nexus
      - /libs/naas-abi-idp
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
        # Some tags read as minor bumps but are not small changes, so each comes
        # in a pull request of its own: `python` 3.12 -> 3.13 changes the
        # interpreter, `ubuntu` 24.04 -> 24.10 leaves the LTS release.
        exclude-patterns: [python, ubuntu]
