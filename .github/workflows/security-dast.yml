# Dynamic security testing against a live, throwaway ABI stack.
#
# Boots the API on the self-hosted runner with `abi dev up` (loopback only,
# placeholder secrets, fresh storage), then attacks it:
#   1. unauthenticated sweep of every GET route (scripts/security/dast.py)
#   2. OWASP ZAP API scan, authenticated, driven by /openapi.json
#   3. Schemathesis property-based fuzzing, authenticated (incl. auth bypass)
#   4. Nuclei templates (exposures, misconfigurations, known CVEs)
#   5. optional AI pentest with Claude Code (needs ANTHROPIC_API_KEY or
#      CLAUDE_CODE_OAUTH_TOKEN as a repo secret; skipped otherwise)
#
# Findings go to the Security tab only. Logs of a public repository are
# world-readable, so the gates run with --quiet and raw reports are never
# uploaded as artifacts.
#
# Rollout: branch-only for now. To run nightly, replace `on:` with:
#
# on:
#   schedule:
#     - cron: "41 3 * * *"
#   workflow_dispatch:

name: Security DAST

on:
  push:
    branches: [ci/security-pipeline]
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-dast
  cancel-in-progress: false

env:
  BASELINES: .github/security/baselines
  UV_NO_PROGRESS: "1"

jobs:
  dast:
    name: DAST against ephemeral stack
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 150
    permissions:
      contents: read
      security-events: write
    env:
      HAS_CLAUDE: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Seed placeholder secrets
        # Every `{{ secret.X }}` still active in config.yaml needs a value or
        # the engine refuses to boot non-interactively. None of these reach a
        # real service; the admin password and API key are generated by
        # `abi dev up` itself.
        run: |
          cp .env.example .env
          {
            echo "OPENAI_API_KEY=sk-placeholder-dast"
            echo "OPENROUTER_API_KEY=sk-or-placeholder-dast"
          } >> .env

      - name: Start oxigraph + api
        run: uv run abi dev up -d --service oxigraph --service api --log-level INFO

      - name: Wait for the API
        id: api
        run: |
          port=$(uv run abi dev ports | awk '$1 == "api" {print $2}')
          echo "port=$port" >> "$GITHUB_OUTPUT"
          echo "url=http://127.0.0.1:$port" >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 120); do
            if curl -fsS -o /dev/null "http://127.0.0.1:$port/docs"; then
              echo "API ready on port $port"
              exit 0
            fi
            sleep 5
          done
          echo "::error::API did not become ready within 10 minutes"
          tail -n 200 .abi/dev/logs/api.log || true
          exit 1

      - name: Log in as the seeded admin
        id: auth
        env:
          API_URL: ${{ steps.api.outputs.url }}
        run: |
          password=$(grep -E '^NEXUS_USER_ADMIN_EXAMPLE_COM_PASSWORD=' .env | cut -d= -f2-)
          echo "::add-mask::$password"
          token=$(curl -fsS -X POST "$API_URL/api/auth/login" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg p "$password" '{email: "admin@example.com", password: $p}')" \
            | jq -r .access_token)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          curl -fsS -o openapi.json "$API_URL/openapi.json"
          echo "OpenAPI: $(jq '.paths | length' openapi.json) paths"

      - name: Unauthenticated route sweep
        env:
          API_URL: ${{ steps.api.outputs.url }}
        run: uv run --no-project scripts/security/dast.py unauth-sweep --base-url "$API_URL" --openapi openapi.json --output unauth.sarif

      - name: OWASP ZAP API scan (authenticated)
        env:
          API_URL: ${{ steps.api.outputs.url }}
          ZAP_AUTH_HEADER_VALUE: Bearer ${{ steps.auth.outputs.token }}
        run: |
          mkdir -p zap && chmod 777 zap
          set +e
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            -e ZAP_AUTH_HEADER_VALUE \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t "$API_URL/openapi.json" -f openapi -J zap.json -I \
              -z "-config scanner.maxScanDurationInMins=40 -config scanner.maxRuleDurationInMins=4" \
            > zap/console.log 2>&1
          echo "zap exit code: $?"
          set -e
          uv run --no-project scripts/security/dast.py zap zap/zap.json --output zap.sarif

      - name: Nuclei
        env:
          API_URL: ${{ steps.api.outputs.url }}
        run: |
          scripts/security/install_tool.sh nuclei \
            https://github.com/projectdiscovery/nuclei/releases/download/v3.11.1/nuclei_3.11.1_linux_amd64.zip \
            ea63d4ae232808cd7c6bc00d0142428e231fab59dae01042246097d195835ab6
          nuclei -silent -disable-update-check -update-templates > /dev/null 2>&1 || true
          nuclei -u "$API_URL" -silent -disable-update-check -no-color \
            -severity low,medium,high,critical -rate-limit 50 \
            -sarif-export nuclei.sarif > /dev/null 2>&1 || true
          # Nuclei writes no file when it finds nothing.
          [ -s nuclei.sarif ] || echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"nuclei"}},"results":[]}]}' > nuclei.sarif

      - name: Schemathesis fuzzing (authenticated)
        # Runs last: it creates and deletes data through every endpoint.
        env:
          API_URL: ${{ steps.api.outputs.url }}
          TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set +e
          uvx schemathesis==4.28.0 run "$API_URL/openapi.json" \
            --checks all --max-examples 10 --workers 4 --request-timeout 15 \
            --header "Authorization: Bearer $TOKEN" \
            --report junit --report-junit-path schemathesis.xml \
            > schemathesis.log 2>&1
          echo "schemathesis exit code: $?"
          set -e
          grep -E "^(=+ SUMMARY|Operations|Test cases|Failures|Errors)" schemathesis.log || true
          uv run --no-project scripts/security/dast.py junit schemathesis.xml --output schemathesis.sarif

      - name: AI pentest (Claude Code)
        id: ai
        if: env.HAS_CLAUDE == 'true'
        uses: anthropics/claude-code-action@9171db3e57d6a3140a37ddc2ba92788584e0ead6 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          display_report: "false"
          show_full_output: "false"
          claude_args: >-
            --max-turns 120
            --allowedTools "Bash(curl:*),Bash(jq:*),Read,Grep,Glob,Write"
          prompt: |
            You are an authorized penetration tester. The target is a throwaway
            instance of this repository's API, running only on this machine at
            ${{ steps.api.outputs.url }} (OpenAPI spec saved in ./openapi.json).
            It holds no real data and is destroyed after this job. Test only
            that URL.

            Log in with POST /api/auth/login as admin@example.com, using the
            NEXUS_USER_ADMIN_EXAMPLE_COM_PASSWORD value from ./.env.

            Use the source code to guide you. Look for, and try to confirm with
            real requests:
            - routes reachable without authentication that should not be
            - broken object-level authorization (IDOR) and cross-workspace or
              cross-organization access
            - privilege escalation from a normal user to admin (create a
              second, non-admin user through the admin API first if possible)
            - JWT/session weaknesses, token scope misuse, missing expiry
            - injection (SPARQL, SQL, command, path traversal in file routes)
            - SSRF through any URL-taking endpoint
            - missing rate limits on authentication endpoints
            Chain findings where you can; a chain is worth more than a list.

            Report ONLY confirmed findings. Write them as SARIF 2.1.0 to
            ./ai-pentest.sarif: one result per finding, ruleId a short
            kebab-case class (e.g. "idor-workspace-files"), level "error" for
            exploitable-by-an-outsider or cross-tenant issues, "warning"
            otherwise, message.text a two-sentence description with the
            reproduction, and physicalLocation.artifactLocation.uri set to the
            source file that contains the bug. Write the file even when you
            confirm nothing (with an empty results array). Do not print
            findings to the console.

      - name: Upload unauth sweep
        if: always() && hashFiles('unauth.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: unauth.sarif
          category: dast-unauth-sweep
      - name: Upload ZAP
        if: always() && hashFiles('zap.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: zap.sarif
          category: dast-zap
      - name: Upload Nuclei
        if: always() && hashFiles('nuclei.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: nuclei.sarif
          category: dast-nuclei
      - name: Upload Schemathesis
        if: always() && hashFiles('schemathesis.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: schemathesis.sarif
          category: dast-schemathesis
      - name: Upload AI pentest
        if: always() && hashFiles('ai-pentest.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ai-pentest.sarif
          category: dast-ai-pentest

      - name: Gate DAST findings
        if: always()
        run: |
          status=0
          gate() { uv run --no-project scripts/security/sarif_gate.py "$1" --tool "$2" --min-severity high --quiet --baseline "$BASELINES/$2.json" || status=1; }
          gate unauth.sarif dast-unauth-sweep
          gate zap.sarif dast-zap
          gate nuclei.sarif dast-nuclei
          gate schemathesis.sarif dast-schemathesis
          if [ -f ai-pentest.sarif ]; then gate ai-pentest.sarif dast-ai-pentest; fi
          exit $status

      - name: Stop the stack
        if: always()
        run: |
          uv run abi dev down || true
          rm -f .env
