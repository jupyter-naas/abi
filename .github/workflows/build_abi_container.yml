name: Build ABI Container

on:
  release:
    types: [published]

permissions:
  contents: read    # This is required for actions/checkout
  packages: write    # This is required for ghcr.io

jobs:
  build:
    # if: startsWith(github.event.release.tag_name, 'naas-abi-v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Cache Docker layers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The job's own token: `packages: write` above.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the release commit is on main
        id: channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only a release cut from main moves :latest. A release from v2 (2.x
          # fixes, which runs its own copy of this workflow) or dev (prereleases)
          # carries a commit main does not contain. The compare API answers
          # "identical" or "ahead" when main contains the tagged commit.
          STATUS=$(gh api "repos/${{ github.repository }}/compare/${{ github.sha }}...main" --jq .status)
          echo "main compared with ${{ github.sha }}: ${STATUS}"
          case "$STATUS" in
            identical|ahead) echo "latest=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "latest=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6

      - name: Build Docker image
        run: |
          touch .env
          make build
          docker tag abi:latest ghcr.io/${{ github.repository }}/abi:${{ github.event.release.tag_name }}
          if [ "${{ steps.channel.outputs.latest }}" = "true" ]; then
            docker tag abi:latest ghcr.io/${{ github.repository }}/abi:latest
          fi

      - name: Push Docker image to GitHub Container Registry
        run: |
          docker push ghcr.io/${{ github.repository }}/abi:${{ github.event.release.tag_name }}
          if [ "${{ steps.channel.outputs.latest }}" = "true" ]; then
            docker push ghcr.io/${{ github.repository }}/abi:latest
          fi
