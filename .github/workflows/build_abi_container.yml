name: Build ABI Container

on:
  release:
    types: [published]

permissions:
  contents: read    # This is required for actions/checkout
  packages: write    # This is required for ghcr.io

jobs:
  build:
    # Only naas-abi releases build the image; the other packages' releases
    # (core, cli, sdk, ...) do not, and never move abi:latest.
    if: startsWith(github.event.release.tag_name, 'naas-abi-v')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The job's own token: `packages: write` above.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6

      - name: Build Docker image
        run: |
          touch .env
          make build
          docker tag abi:latest ghcr.io/${{ github.repository }}/abi:${{ github.event.release.tag_name }}

      - name: Decide whether this release moves :latest
        id: channel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          # abi:latest moves only for the highest stable naas-abi-v* release
          # whose commit is on main (see the script). Checked after the build,
          # right before the push, so a newer release published meanwhile wins.
          .github/scripts/release_is_latest.sh "$RELEASE_TAG" "$RELEASE_SHA" "$REPO"

      - name: Push Docker image to GitHub Container Registry
        run: |
          docker push ghcr.io/${{ github.repository }}/abi:${{ github.event.release.tag_name }}
          if [ "${{ steps.channel.outputs.latest }}" = "true" ]; then
            docker tag abi:latest ghcr.io/${{ github.repository }}/abi:latest
            docker push ghcr.io/${{ github.repository }}/abi:latest
          fi
