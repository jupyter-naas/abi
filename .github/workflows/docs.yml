name: Docs site

# Builds the Docusaurus site (docs/site) on every change to it: broken links and
# anchors fail the build. Publishing is not this workflow's: the Cloudflare
# Pages project `abi-docs` builds the site from the repository itself, `main` to
# abi-docs-76c.pages.dev and a preview per branch. docs.naas.ai is served by
# another site.

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout ABI
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: Install dependencies
        working-directory: docs/site
        run: npm ci

      - name: Build the site
        working-directory: docs/site
        run: npm run build
