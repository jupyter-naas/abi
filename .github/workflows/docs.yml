name: Docs site

# Builds the Docusaurus site (docs/site) on every change to it: broken links and
# anchors fail the build. Publishing is by hand (Run workflow), to the
# Cloudflare Pages project `abi-docs` (abi-docs.pages.dev). docs.naas.ai is
# served by another site and does not change.

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout ABI
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: Install dependencies
        working-directory: docs/site
        run: npm ci

      - name: Build the site
        working-directory: docs/site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'workflow_dispatch' && github.repository == 'jupyter-naas/abi'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: abi-docs
          directory: docs/site/build
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
