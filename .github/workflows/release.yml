name: Release
on:
  push:
    branches:
      - dev
      - main
  # Uploads the files of an existing GitHub release to PyPI (job publish-existing).
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose files to upload to PyPI, e.g. naas-abi-sdk-v0.1.0
        required: true
        type: string

permissions:
  contents: read


jobs:

  # Versions, builds and tags each package that has changes, and makes its
  # GitHub release. It holds the release PAT, in one step, and cannot publish to
  # PyPI: the publish job below does, with the files this job built.
  release:
    runs-on: ubuntu-latest
    if: github.repository == 'jupyter-naas/abi' && github.event_name == 'push'
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      # The released packages, space-separated.
      released: ${{ steps.release.outputs.released }}

    steps:

      - name: Setup | Checkout Repository on Release Branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          # No token in .git/config: semantic-release pushes with GH_TOKEN, in
          # its own step.
          persist-credentials: false

      - name: Setup | Force release branch to be at workflow sha
        run: |
          git reset --hard ${{ github.sha }}

      - name: Setup | Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Setup | Release tooling
        # semantic-release, GitPython and uv at the versions and hashes of
        # .github/requirements/release.txt.
        run: python -m pip install --require-hashes -r .github/requirements/release.txt

      # Released in dependency order: naas-abi-core's nats/otel extras need
      # naas-abi-proto and naas-abi-sdk, naas-abi-idp (the built-in identity
      # provider) needs both, and naas-abi needs naas-abi-core[nats].
      - name: Release | Version, build and GitHub release of each package
        id: release
        env:
          GH_TOKEN: ${{ secrets.M_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          released=""
          for name in naas-abi-proto naas-abi-sdk naas-abi-idp naas-abi-core naas-abi-marketplace naas-abi naas-abi-cli; do
            outputs="$(mktemp)"
            (cd "libs/$name" && GITHUB_OUTPUT="$outputs" semantic-release -v version)
            if grep -qx 'released=true' "$outputs"; then
              tag="$(sed -n 's/^tag=//p' "$outputs")"
              (cd "libs/$name" && semantic-release publish --tag "$tag")
              released="$released $name"
            fi
          done
          echo "released=${released# }" >> "$GITHUB_OUTPUT"

      - name: Release | Keep the built files for the publish job
        if: steps.release.outputs.released != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: libs/*/dist/
          if-no-files-found: error
          retention-days: 7

  # Uploads what the release job built to PyPI, as the trusted publisher
  # (workflow release.yml, environment pypi). Its only grant is the OIDC token.
  publish:
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released != ''
    environment:
      name: pypi
    permissions:
      id-token: write

    steps:

      - name: Download | The release job's built files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: libs

      - name: Publish | Upload naas-abi-proto to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        if: contains(format(' {0} ', needs.release.outputs.released), ' naas-abi-proto ')
        with:
          packages-dir: libs/naas-abi-proto/dist

      - name: Publish | Upload naas-abi-sdk to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        if: contains(format(' {0} ', needs.release.outputs.released), ' naas-abi-sdk ')
        with:
          packages-dir: libs/naas-abi-sdk/dist

      - name: Publish | Upload naas-abi-idp to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        if: contains(format(' {0} ', needs.release.outputs.released), ' naas-abi-idp ')
        with:
          packages-dir: libs/naas-abi-idp/dist

      - name: Publish | Upload naas-abi-core to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        if: contains(format(' {0} ', needs.release.outputs.released), ' naas-abi-core ')
        with:
          packages-dir: libs/naas-abi-core/dist

      - name: Publish | Upload naas-abi-marketplace to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        if: contains(format(' {0} ', needs.release.outputs.released), ' naas-abi-marketplace ')
        with:
          packages-dir: libs/naas-abi-marketplace/dist

      - name: Publish | Upload naas-abi to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        if: contains(format(' {0} ', needs.release.outputs.released), ' naas-abi ')
        with:
          packages-dir: libs/naas-abi/dist

      - name: Publish | Upload naas-abi-cli to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        if: contains(format(' {0} ', needs.release.outputs.released), ' naas-abi-cli ')
        with:
          packages-dir: libs/naas-abi-cli/dist

  # A release whose upload failed (a missing or wrong trusted publisher) is not
  # released again: its tag exists, so semantic-release has nothing to do. Run this
  # job from main (Actions > Release > Run workflow) with the tag, one package at a
  # time and in dependency order: naas-abi-proto, naas-abi-sdk, naas-abi-idp, naas-abi-core,
  # naas-abi-marketplace, naas-abi, naas-abi-cli. It runs in this file so that the
  # trusted publishers (workflow release.yml, environment pypi) apply. Versions
  # already on PyPI are skipped.
  publish-existing:
    runs-on: ubuntu-latest
    if: github.repository == 'jupyter-naas/abi' && github.event_name == 'workflow_dispatch'
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download | Files of the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist

      - name: Publish | Upload to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
