name: Release
on:
  push:
    branches:
      - dev
      - main
  # Uploads the files of an existing GitHub release to PyPI (job publish-existing).
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose files to upload to PyPI, e.g. naas-abi-sdk-v0.1.0
        required: true
        type: string

permissions:
  contents: write
  id-token: write


jobs:

  release:
    runs-on: ubuntu-latest
    if: github.repository == 'jupyter-naas/abi' && github.event_name == 'push'
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false

    environment:
      name: pypi

    env:
      # Released in dependency order: naas-abi-core's nats/otel extras need
      # naas-abi-proto and naas-abi-sdk, naas-abi-idp (the built-in identity
      # provider) needs both, and naas-abi needs naas-abi-core[nats].
      naas_abi_proto_dir: libs/naas-abi-proto
      naas_abi_sdk_dir: libs/naas-abi-sdk
      naas_abi_idp_dir: libs/naas-abi-idp
      naas_abi_core_dir: libs/naas-abi-core
      naas_abi_marketplace_dir: libs/naas-abi-marketplace
      naas_abi_dir: libs/naas-abi
      naas_abi_cli_dir: libs/naas-abi-cli
      GH_TOKEN: ${{ secrets.M_ACCESS_TOKEN }}

    steps:

      - name: Setup | Checkout Repository on Release Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.M_ACCESS_TOKEN }}
          fetch-depth: 0

      - name: Setup | Force release branch to be at workflow sha
        run: |
          git reset --hard ${{ github.sha }}

      - name: Setup | Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup | python-semantic-release
        run: |
          python -m pip install --upgrade pip
          # The PSR Docker action rebuilds from PyPI on each run. GitPython 3.1.60
          # (2026-08-25) removed Actor.name_email_regex, which PSR 10.5.2 still
          # uses while loading commit_author. Pin GitPython until PSR is updated.
          python -m pip install "python-semantic-release==10.5.2" "GitPython>=3.1.43,<3.1.60"

      # ------------------------------------------------------------------- #
      # Note the use of different IDs to distinguish which submodule was    #
      # identified to be released. The subsequent actions then reference    #
      # their specific release ID to determine if a release occurred.       #
      # ------------------------------------------------------------------- #

      - name: Release naas-abi-proto
        id: release-naas-abi-proto
        working-directory: ${{ env.naas_abi_proto_dir }}
        run: semantic-release -v version

      - name: Release naas-abi-sdk
        id: release-naas-abi-sdk
        working-directory: ${{ env.naas_abi_sdk_dir }}
        run: semantic-release -v version

      - name: Release naas-abi-idp
        id: release-naas-abi-idp
        working-directory: ${{ env.naas_abi_idp_dir }}
        run: semantic-release -v version

      - name: Release naas-abi-core
        id: release-naas-abi-core
        working-directory: ${{ env.naas_abi_core_dir }}
        run: semantic-release -v version

      - name: Release naas-abi-marketplace
        id: release-naas-abi-marketplace
        working-directory: ${{ env.naas_abi_marketplace_dir }}
        run: semantic-release -v version

      - name: Release naas-abi
        id: release-naas-abi
        working-directory: ${{ env.naas_abi_dir }}
        run: semantic-release -v version

      - name: Release naas-abi-cli
        id: release-naas-abi-cli
        working-directory: ${{ env.naas_abi_cli_dir }}
        run: semantic-release -v version

      - name: Publish | Upload naas-abi-proto to GitHub Release Assets
        if: steps.release-naas-abi-proto.outputs.released == 'true'
        working-directory: ${{ env.naas_abi_proto_dir }}
        run: semantic-release publish --tag "${{ steps.release-naas-abi-proto.outputs.tag }}"

      - name: Publish | Upload naas-abi-sdk to GitHub Release Assets
        if: steps.release-naas-abi-sdk.outputs.released == 'true'
        working-directory: ${{ env.naas_abi_sdk_dir }}
        run: semantic-release publish --tag "${{ steps.release-naas-abi-sdk.outputs.tag }}"

      - name: Publish | Upload naas-abi-idp to GitHub Release Assets
        if: steps.release-naas-abi-idp.outputs.released == 'true'
        working-directory: ${{ env.naas_abi_idp_dir }}
        run: semantic-release publish --tag "${{ steps.release-naas-abi-idp.outputs.tag }}"

      - name: Publish | Upload naas-abi-core to GitHub Release Assets
        if: steps.release-naas-abi-core.outputs.released == 'true'
        working-directory: ${{ env.naas_abi_core_dir }}
        run: semantic-release publish --tag "${{ steps.release-naas-abi-core.outputs.tag }}"

      - name: Publish | Upload naas-abi-marketplace to GitHub Release Assets
        if: steps.release-naas-abi-marketplace.outputs.released == 'true'
        working-directory: ${{ env.naas_abi_marketplace_dir }}
        run: semantic-release publish --tag "${{ steps.release-naas-abi-marketplace.outputs.tag }}"

      - name: Publish | Upload naas-abi to GitHub Release Assets
        if: steps.release-naas-abi.outputs.released == 'true'
        working-directory: ${{ env.naas_abi_dir }}
        run: semantic-release publish --tag "${{ steps.release-naas-abi.outputs.tag }}"

      - name: Publish | Upload naas-abi-cli to GitHub Release Assets
        if: steps.release-naas-abi-cli.outputs.released == 'true'
        working-directory: ${{ env.naas_abi_cli_dir }}
        run: semantic-release publish --tag "${{ steps.release-naas-abi-cli.outputs.tag }}"

      # ------------------------------------------------------------------- #
      # Python Semantic Release is not responsible for publishing your      #
      # python artifacts to PyPI. Use the official PyPA publish action      #
      # instead. The following steps are an example but is not guaranteed   #
      # to work as the action is not maintained by the                      #
      # python-semantic-release team.                                       #
      # ------------------------------------------------------------------- #

      - name: Publish | Upload naas-abi-proto to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        if: steps.release-naas-abi-proto.outputs.released == 'true'
        with:
          packages-dir: ${{ format('{0}/dist', env.naas_abi_proto_dir) }}

      - name: Publish | Upload naas-abi-sdk to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        if: steps.release-naas-abi-sdk.outputs.released == 'true'
        with:
          packages-dir: ${{ format('{0}/dist', env.naas_abi_sdk_dir) }}

      - name: Publish | Upload naas-abi-idp to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        if: steps.release-naas-abi-idp.outputs.released == 'true'
        with:
          packages-dir: ${{ format('{0}/dist', env.naas_abi_idp_dir) }}

      - name: Publish | Upload naas-abi-core to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        if: steps.release-naas-abi-core.outputs.released == 'true'
        with:
          packages-dir: ${{ format('{0}/dist', env.naas_abi_core_dir) }}

      - name: Publish | Upload naas-abi-marketplace to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        if: steps.release-naas-abi-marketplace.outputs.released == 'true'
        with:
          packages-dir: ${{ format('{0}/dist', env.naas_abi_marketplace_dir) }}


      - name: Publish | Upload naas-abi to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        if: steps.release-naas-abi.outputs.released == 'true'
        with:
          packages-dir: ${{ format('{0}/dist', env.naas_abi_dir) }}

      - name: Publish | Upload naas-abi-cli to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        if: steps.release-naas-abi-cli.outputs.released == 'true'
        with:
          packages-dir: ${{ format('{0}/dist', env.naas_abi_cli_dir) }}

  # A release whose upload failed (a missing or wrong trusted publisher) is not
  # released again: its tag exists, so semantic-release has nothing to do. Run this
  # job from main (Actions > Release > Run workflow) with the tag, one package at a
  # time and in dependency order: naas-abi-proto, naas-abi-sdk, naas-abi-idp, naas-abi-core,
  # naas-abi-marketplace, naas-abi, naas-abi-cli. It runs in this file so that the
  # trusted publishers (workflow release.yml, environment pypi) apply. Versions
  # already on PyPI are skipped.
  publish-existing:
    runs-on: ubuntu-latest
    if: github.repository == 'jupyter-naas/abi' && github.event_name == 'workflow_dispatch'
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download | Files of the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist

      - name: Publish | Upload to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
