name: Build Nexus Web Container

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: startsWith(github.event.release.tag_name, 'naas-abi-v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the release commit is on main
        id: channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only a release cut from main moves :latest. A release from v2 (2.x
          # fixes, which runs its own copy of this workflow) or dev (prereleases)
          # carries a commit main does not contain. The compare API answers
          # "identical" or "ahead" when main contains the tagged commit.
          STATUS=$(gh api "repos/${{ github.repository }}/compare/${{ github.sha }}...main" --jq .status)
          echo "main compared with ${{ github.sha }}: ${STATUS}"
          case "$STATUS" in
            identical|ahead) echo "latest=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "latest=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Compute image tags
        id: tags
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          VERSION="${RELEASE_TAG#naas-abi-v}"
          IMAGE="ghcr.io/${OWNER}/nexus-web"

          {
            echo "list<<EOF"
            if [ "${{ steps.channel.outputs.latest }}" = "true" ]; then
              echo "${IMAGE}:latest"
            fi
            echo "${IMAGE}:${VERSION}"
            echo "${IMAGE}:${RELEASE_TAG}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: libs/naas-abi/naas_abi/apps/nexus
          file: libs/naas-abi/naas_abi/apps/nexus/Dockerfile.release
          push: true
          platforms: linux/amd64, linux/arm64
          tags: ${{ steps.tags.outputs.list }}
