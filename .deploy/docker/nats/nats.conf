# nats-server configuration mounted by docker-compose (-c /etc/nats/nats.conf).
# Ports, bind address and JetStream stay on the command line; this file carries
# what the command line cannot: max_payload and the broker's users.

# Hard ceiling for ONE message: one RPC request or one reply. The 1 MB default
# refuses a 2 MB get_object or a whole-store triple_store.get. 8 MB is the
# largest value NATS recommends -- do not raise it further. Anything bigger
# must stream in chunks or return a storage reference instead.
max_payload: 8MB

# What the user `module` may not do (docs/adr/20261014_module-identities.md):
# listen on the engine's service and discovery subjects (it would overhear the
# calls and the tokens they carry, or answer in their place), read or write the
# engine's key-value buckets directly, or delete or restore streams. It may
# still call every service, serve its own subjects and run its jobs. All
# modules share this user, so one module can still listen on another's
# subjects: per-module broker users are the next step.
MODULE_PERMISSIONS = {
  publish: {
    deny: [
      "$KV.>"
      "$JS.API.STREAM.DELETE.>"
      "$JS.API.STREAM.MSG.DELETE.>"
      "$JS.API.STREAM.SNAPSHOT.>"
      "$JS.API.STREAM.RESTORE.>"
      "$JS.API.STREAM.PEER.>"
      "$JS.API.STREAM.LEADER.>"
      "$JS.API.META.>"
      "$JS.API.SERVER.>"
      "$JS.API.ACCOUNT.>"
    ]
  }
  subscribe: {
    deny: ["abi.svc.>", "abi.discovery.>", "$KV.>"]
  }
}

# Every client logs in. `abi deploy local` generates both passwords in .env and
# the compose service refuses to start without them: nats-server would take an
# empty $VAR as an empty password. A client passes its password in the URL:
# nats://abi:<NATS_ABI_PASSWORD>@nats:4222.
# - abi: the engine's process (kernel services, API, Nexus, jobs). Every right.
# - module: SDK modules joining the engine, within MODULE_PERMISSIONS.
# The passwords keep out whatever else reaches the broker (other containers on
# the Docker network, such as coding workspaces and CI jobs).
authorization {
  users = [
    { user: abi, password: $NATS_ABI_PASSWORD }
    { user: module, password: $NATS_MODULE_PASSWORD, permissions: $MODULE_PERMISSIONS }
  ]
}
