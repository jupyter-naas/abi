[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-api"
version = "0.0.1"
description = "NEXUS Platform API - ABI Integration Layer"
requires-python = ">=3.10"
dependencies = [
    # Core
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # Database
    "sqlalchemy>=2.0.0",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    # Redis (caching/sessions)
    "redis>=5.0.0",
    # HTTP client
    "httpx>=0.26.0",
    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.6",
    "email-validator>=2.0.0",
    # AI/LLM
    "openai>=1.10.0",
    "anthropic>=0.18.0",
    "ollama>=0.1.0",
    "tiktoken>=0.5.0",
    # Storage (S3/MinIO)
    "boto3>=1.34.0",
    # Utilities
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "PyYAML",
    "python-socketio>=5.16.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]
cloudflare = [
    "workers-py; python_version>='3.12'",
    "workers-runtime-sdk; python_version>='3.12'",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    # Type stubs for better type checking
    "types-redis>=4.6.0.20241004",
    "types-pyyaml>=6.0.12.20250915",
    "types-boto3>=1.42.42",
    "types-python-jose>=3.5.0.20250531",
    "types-python-dateutil>=2.9.0.20260124",
]

[tool.ruff]
# Ruff resolves settings from the nearest pyproject.toml holding a [tool.ruff]
# table, and that table replaces the one above it rather than adding to it. This
# subtree therefore ran on its own ruleset and never saw the root config, so the
# TID251 zen import ban did not apply to the chat service, the streaming adapter
# or the slides adapter. `extend` makes the root config the base and keeps the
# selections below as additions on top of it.
extend = "../../../../../../../pyproject.toml"
# Both of these have to stay. `extend` does not carry the root target-version
# across, because this file has its own `requires-python = ">=3.10"` and ruff
# reads that first, which would quietly retarget the UP rules at 3.10. Dropping
# line-length would take the subtree from 100 to the default 88 and make the
# next `make fmt` reformat every file in it.
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Kept because the root default set does not cover these whole families: they
# add E7xx comparisons, W29x whitespace, B904/B905, F403/F405 and UP013/UP015.
extend-select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
# A child extend-select is applied after the parent's ignore list, so pulling in
# the whole B family above switches B008 and B017 back on even though the root
# config ignores both. They are restated here for the same reasons the root
# gives, not as new exceptions.
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # FastAPI Depends/Query in argument defaults is the framework idiom
    "B017",  # tests assert pytest.raises(Exception) for unknown adapters
]

[tool.ruff.lint.extend-per-file-ignores]
# Pre-existing debt, not an endorsement. Inheriting the root config turned on
# 245 rules this subtree had never been linted against, and they found 391
# violations that were already in the tree. Suppressing them here is what lets
# the consolidation land in one commit; every code below is a separate cleanup
# waiting to happen, and the counts are here so the list can be seen shrinking.
#
# Four of these are latent bugs rather than style, and are called out so nobody
# reads the whole block as cosmetic: DTZ* (naive timestamps in a service that
# persists them), S110/S112 (silently swallowed exceptions, the same failure
# mode that hid the zen import for weeks), ASYNC220/ASYNC230 (blocking
# subprocess and file IO on the event loop), PLW1510 (unchecked subprocess.run).
"**/*.py" = [
    "BLE001",   # 125  blind `except Exception`
    "RUF100",   #  74  dead `# noqa: E501`, removable with --fix once E501 stays off
    "DTZ005",   #  41  datetime.now() without tz
    "S110",     #  31  try/except/pass
    "DTZ003",   #  22  datetime.utcnow()
    "RUF010",   #  19  explicit str() inside f-string
    "S112",     #  13  try/except/continue
    "RUF022",   #  12  unsorted __all__
    "PIE810",   #   9  repeated startswith instead of a tuple
    "DTZ001",   #   8  datetime() without tzinfo
    "SIM117",   #   6  nested with statements
    "PIE790",   #   5  unnecessary pass
    "ASYNC230", #   3  blocking open() in an async function
    "FURB188",  #   3  slice instead of removeprefix/removesuffix
    "G201",     #   2  logging.error(exc_info=True) instead of .exception()
    "PERF102",  #   2  .items() where only keys or values are used
    "PYI063",   #   2  pre-PEP570 positional-only marker
    "RUF019",   #   2  redundant dict key check before access
    "ASYNC220", #   1  blocking subprocess in an async function
    "DTZ901",   #   1  datetime.min without tz
    "EXE001",   #   1  shebang on a non-executable file
    "FURB192",  #   1  sorted()[0] instead of min()
    "PLR1711",  #   1  useless trailing return
    "PLR1730",  #   1  if/assign instead of min()/max()
    "PLW1510",  #   1  subprocess.run without explicit check
    "PYI034",   #   1  __enter__ should return Self
    "RET501",   #   1  explicit `return None` where bare return reads better
    "RUF023",   #   1  unsorted __slots__
    "RUF051",   #   1  `if k in d: del d[k]` instead of pop
    "SIM103",   #   1  return the condition directly
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
# Type stubs are installed for: redis, PyYAML, boto3, python-jose, python-dateutil
# FastAPI has built-in type hints (py.typed marker), no separate stub package exists
# Set to false to allow mypy to properly check FastAPI and other typed packages
ignore_missing_imports = false
# Enable pydantic plugin for better Pydantic/FastAPI type checking
# (plugin is included with pydantic package, no separate install needed)
plugins = ["pydantic.mypy"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
