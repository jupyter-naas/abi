[project]
name = "naas-abi-proto"
version = "0.1.0"
description = "Standalone ABI proto package"
requires-python = ">=3.10"
dependencies = ["protobuf>=6.33.5,<7"]
readme = "README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["**/*_pb2.py", "**/*_pb2.pyi"]

[tool.semantic_release]
commit_parser = "conventional-monorepo"
commit_message = """\
chore(release): naas-abi-proto@{version}`

Automatically generated by python-semantic-release
"""
tag_format = "naas-abi-proto-v{version}"
version_toml = ["pyproject.toml:project.version"]
# Stay on 0.x: the first release is 0.1.0 (PSR 10 would start at 1.0.0), and a
# breaking change bumps the minor until the contracts are declared stable.
allow_zero_version = true
major_on_zero = false
build_command = """
    python -m pip install uv>=0.9.13
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""

[tool.semantic_release.commit_parser_options]
path_filters = ["."]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.dev]
match = "^dev"
prerelease = true
prerelease_token = "dev"
