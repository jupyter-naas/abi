[project]
name = "naas-abi-proto"
version = "0.1.0"
description = "Standalone ABI proto package"
requires-python = ">=3.10"
dependencies = ["protobuf>=6.33.5,<7"]
readme = "README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["**/*_pb2.py", "**/*_pb2.pyi"]
