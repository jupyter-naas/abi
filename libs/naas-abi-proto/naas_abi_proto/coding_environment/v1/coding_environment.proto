// NATS-RPC contract for the coding_environment kernel domain.
// Mirrors naas_abi_core/services/coding_environment/CodingEnvironmentPorts.py
// ::ICodingEnvironmentAdapter 1:1. See
// docs/specs/rfcs/20260910_distributed-modules-nats-jetstream.md.
//
// Scope of this v1 contract, deliberately: only the 10
// ICodingEnvironmentAdapter methods below are exposed. The following are
// explicitly NOT part of this contract and have no endpoint here at all:
//   - `wait_until_ready` -- a client-side polling loop built purely from
//     repeated `get_status` calls; it needs no RPC of its own.
//   - `get_workspace_ui_url`/`get_runtime_binding`/`get_harness_binding` --
//     optional, getattr-probed adapter extension methods that only some
//     concrete adapters implement. A primary adapter serving this contract
//     simply doesn't define handlers for them, matching how an adapter that
//     doesn't support them already behaves locally via `getattr(..., None)`.
//
// `phase` (see WorkspaceStatus) is deliberately a plain `string`, not a
// closed proto enum: CodingEnvironmentPorts.py keeps PHASE_PROVISIONING/
// PHASE_RUNNING/PHASE_STOPPED/PHASE_ERROR as string constants rather than a
// closed Python enum specifically so a custom adapter can return other
// values (e.g. an orchestrator-specific transitional phase); a closed wire
// enum would silently truncate any such value to UNKNOWN/0 on every remote
// hop, which the in-process case never does.
//
// `params` (see ProvisionRequest/StartRequest) is a genuine string-to-string
// map, not a Struct -- ICodingEnvironmentAdapter types it as
// `dict[str, str] | None`, never arbitrary nested JSON. proto3 map fields
// have no field-presence tracking (unlike `optional` scalars), so an absent
// map and an explicitly-empty map are indistinguishable on the wire. Both
// sides of this contract collapse that: an empty/absent `params` map is
// treated as Python `None` wherever it's handed to
// ICodingEnvironmentAdapter, matching that method's own default and never
// forcing a caller to distinguish "no params" from "empty params" (the
// adapters never do either).
//
// Subjects (see "Protobuf contract shapes" in the RFC):
//   abi.svc.coding_environment.v1.ensure_user
//   abi.svc.coding_environment.v1.list_templates
//   abi.svc.coding_environment.v1.provision
//   abi.svc.coding_environment.v1.start
//   abi.svc.coding_environment.v1.stop
//   abi.svc.coding_environment.v1.delete
//   abi.svc.coding_environment.v1.list_environments
//   abi.svc.coding_environment.v1.get_status
//   abi.svc.coding_environment.v1.get_logs
//   abi.svc.coding_environment.v1.get_access
syntax = "proto3";

package abi.coding_environment.v1;

import "naas_abi_proto/common/v1/common.proto";

message WorkspaceTemplate {
  string id = 1;
  string name = 2;
  string active_version_id = 3;
}

message WorkspaceStatus {
  string id = 1;
  string name = 2;
  string phase = 3;  // one of CodingEnvironmentPorts.PHASE_* -- see file header
  bool agent_ready = 4;
}

message WorkspaceAccess {
  string url = 1;
  optional string token = 2;
  optional string expires_at = 3;
}

message EnsureUserRequest {
  abi.common.v1.CallContext context = 1;
  string external_id = 2;
  string email = 3;
  string username = 4;
}
message EnsureUserResponse {
  oneof result {
    string user_id = 1;
    abi.common.v1.CallError error = 2;
  }
}

message ListTemplatesRequest {
  abi.common.v1.CallContext context = 1;
}
message ListTemplatesResponse {
  oneof result {
    WorkspaceTemplates templates = 1;
    abi.common.v1.CallError error = 2;
  }
}
message WorkspaceTemplates {
  repeated WorkspaceTemplate templates = 1;
}

message ProvisionRequest {
  abi.common.v1.CallContext context = 1;
  string user_id = 2;
  string template_id = 3;
  string name = 4;
  map<string, string> params = 5;
}
message ProvisionResponse {
  oneof result {
    WorkspaceStatus status = 1;
    abi.common.v1.CallError error = 2;
  }
}

message StartRequest {
  abi.common.v1.CallContext context = 1;
  string workspace_id = 2;
  map<string, string> params = 3;
}
message StartResponse {
  oneof result {
    WorkspaceStatus status = 1;
    abi.common.v1.CallError error = 2;
  }
}

message StopRequest {
  abi.common.v1.CallContext context = 1;
  string workspace_id = 2;
}
message StopResponse {
  oneof result {
    WorkspaceStatus status = 1;
    abi.common.v1.CallError error = 2;
  }
}

message DeleteRequest {
  abi.common.v1.CallContext context = 1;
  string workspace_id = 2;
}
message DeleteResponse {
  // Empty on success -- the error, if any, is the whole signal.
  optional abi.common.v1.CallError error = 1;
}

message ListEnvironmentsRequest {
  abi.common.v1.CallContext context = 1;
  string user_id = 2;
}
message ListEnvironmentsResponse {
  oneof result {
    WorkspaceStatuses environments = 1;
    abi.common.v1.CallError error = 2;
  }
}
message WorkspaceStatuses {
  repeated WorkspaceStatus environments = 1;
}

message GetStatusRequest {
  abi.common.v1.CallContext context = 1;
  string workspace_id = 2;
}
message GetStatusResponse {
  oneof result {
    WorkspaceStatus status = 1;
    abi.common.v1.CallError error = 2;
  }
}

message GetLogsRequest {
  abi.common.v1.CallContext context = 1;
  string workspace_id = 2;
}
message GetLogsResponse {
  oneof result {
    LogLines lines = 1;
    abi.common.v1.CallError error = 2;
  }
}
message LogLines {
  repeated string lines = 1;
}

message GetAccessRequest {
  abi.common.v1.CallContext context = 1;
  string workspace_id = 2;
  string user_id = 3;
  string app_slug = 4;
}
message GetAccessResponse {
  oneof result {
    WorkspaceAccess access = 1;
    abi.common.v1.CallError error = 2;
  }
}
