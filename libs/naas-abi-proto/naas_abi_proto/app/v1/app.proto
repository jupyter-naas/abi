syntax = "proto3";
package abi.app.v1;
import "naas_abi_proto/common/v1/common.proto";

// An HTTP request Nexus forwards to a remote module's app, on
// abi.mod.<project>.<instance_id>.app.<name>.http
// (docs/adr/20261012_remote-module-apps.md). Body at most 1 MiB.
message Header { string name = 1; string value = 2; }
message HttpRequest {
  abi.common.v1.CallContext context = 1;
  string app = 2;
  string method = 3;
  // Below the app's root, starting with "/".
  string path = 4;
  // Without the leading "?".
  string query = 5;
  repeated Header headers = 6;
  bytes body = 7;
  // Where Nexus mounts the app, e.g. /app-html/remote/<module_id>/<app>.
  string root_path = 8;
  // The signed-in Nexus user; empty for an ABI_API_KEY caller.
  string user_id = 9;
}
// Body at most 6 MiB.
message HttpResponse {
  abi.common.v1.CallError error = 1;
  uint32 status = 2;
  repeated Header headers = 3;
  bytes body = 4;
}
