syntax = "proto3";
package abi.app.v1;
import "naas_abi_proto/common/v1/common.proto";

// An HTTP request Nexus forwards to a remote module's app, on
// abi.mod.<project>.<instance_id>.app.<name>.http
// (docs/adr/20261012_remote-module-apps.md). A small body travels inline. A
// larger one follows: the module pulls it from body_inbox with BodyPull, one
// chunk at a time, so it is never read faster than the app consumes it.
message Header { string name = 1; string value = 2; }
message HttpRequest {
  abi.common.v1.CallContext context = 1;
  string app = 2;
  string method = 3;
  // Below the app's root, starting with "/".
  string path = 4;
  // Without the leading "?".
  string query = 5;
  repeated Header headers = 6;
  bytes body = 7;
  // Where Nexus mounts the app, e.g. /app-html/remote/<module_id>/<app>.
  string root_path = 8;
  // Request data, never identity: the app host replaces it with the user the
  // caller's verified credentials act for (discovery's AuthorizeApp), empty
  // for a caller acting for nobody.
  string user_id = 9;
  // The body continues after `body` (its first bytes): pull the rest from
  // body_inbox. The total is at most max_body_bytes.
  bool body_follows = 10;
  string body_inbox = 11;
  uint64 max_body_bytes = 12;
}
// Sent once the app starts its response. A small body travels inline; a larger
// or streamed one (downloads, server-sent events) follows: Nexus pulls it from
// body_inbox with BodyPull.
message HttpResponse {
  abi.common.v1.CallError error = 1;
  uint32 status = 2;
  repeated Header headers = 3;
  bytes body = 4;
  bool body_follows = 5;
  string body_inbox = 6;
}
// Asks the holder of a body for chunk `sequence` (0, 1, 2, ...). Asking for the
// last chunk again returns it again (a lost reply). `cancel`: the reader is
// gone; the holder stops and answers nothing more.
message BodyPull {
  uint64 sequence = 1;
  bool cancel = 2;
}
// `data` may be empty without `last`: nothing new yet, ask again (it keeps an
// idle stream, such as server-sent events, alive).
message BodyChunk {
  abi.common.v1.CallError error = 1;
  uint64 sequence = 2;
  bytes data = 3;
  bool last = 4;
}
