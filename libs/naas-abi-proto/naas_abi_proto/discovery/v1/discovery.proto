syntax = "proto3";
package abi.discovery.v1;
import "naas_abi_proto/common/v1/common.proto";

message AgentDescriptor {
  string name = 1;
  string description = 2;
  uint32 contract_major = 3;
  repeated string capabilities = 4;
}
// One way a job is started: kind "cron" (6-field cron, optional IANA time
// zone), "every" (Go duration such as "1h") or "event" (NATS event subject).
message JobTrigger {
  string kind = 1;
  string spec = 2;
  string time_zone = 3;
  // An `event` trigger's filter on the event's fields, as JSON (EventBridge-style,
  // naas_abi_sdk/event_filter.py); empty: every event.
  string filter = 4;
}
message JobDescriptor {
  string name = 1;
  string description = 2;
  uint32 contract_major = 3;
  repeated JobTrigger triggers = 4;
  uint32 max_concurrency = 5;
  uint32 max_attempts = 6;
  double timeout_seconds = 7;
}
message Dependency { string module_id = 1; uint32 contract_major = 2; }
// A chat model this module serves. Inference stays in the module process.
message ModelDescriptor {
  string name = 1;
  string description = 2;
  string kind = 3;
}
// A web app this module serves over NATS (abi.app.v1); Nexus forwards its
// requests under /app-html/remote/<module_id>/<name>/.
message AppDescriptor {
  string name = 1;
  string title = 2;
  string description = 3;
  string category = 4;
  string icon_emoji = 5;
  // The entry page below the app's root, default "index.html".
  string entry = 6;
  uint32 contract_major = 7;
  // Largest request body Nexus forwards; zero: Nexus's default (1 GiB).
  uint64 max_upload_bytes = 8;
}
message ModuleDescriptor {
  string module_id = 1;
  string package_version = 2;
  uint32 contract_major = 3;
  repeated Dependency dependencies = 4;
  repeated AgentDescriptor agents = 5;
  repeated JobDescriptor jobs = 6;
  repeated ModelDescriptor models = 7;
  repeated AppDescriptor apps = 8;
}
message Instance {
  ModuleDescriptor descriptor = 1;
  string instance_id = 2;
  // Computed: STARTING, READY, DEGRADED, DRAINING, STAGED.
  string status = 3;
  double expires_at = 4;
  // The deploy this process belongs to. Empty when the process is not in a rollout.
  string rollout_id = 5;
}
message RegisterRequest {
  abi.common.v1.CallContext context = 1;
  ModuleDescriptor descriptor = 2;
  string instance_id = 3;
  string lease_token = 4;
  // Same value on every process that must cut over together. Empty is not a rollout.
  string rollout_id = 5;
  // Module ids that must be initialized before this rollout replaces the previous
  // one. Empty with a rollout id means this module alone. Every process in the
  // rollout sends the same list.
  repeated string rollout_modules = 6;
}
message RegisterResponse { abi.common.v1.CallError error = 1; Instance instance = 2; double lease_seconds = 3; }
message RenewRequest {
  abi.common.v1.CallContext context = 1;
  string instance_id = 2;
  string lease_token = 3;
  bool initialized = 4;
  bool draining = 5;
}
message RenewResponse { abi.common.v1.CallError error = 1; Instance instance = 2; double lease_seconds = 3; }
message UnregisterRequest { abi.common.v1.CallContext context = 1; string instance_id = 2; string lease_token = 3; }
message UnregisterResponse { abi.common.v1.CallError error = 1; }
message GetModuleRequest { abi.common.v1.CallContext context = 1; string module_id = 2; uint32 contract_major = 3; }
message GetModuleResponse { abi.common.v1.CallError error = 1; repeated Instance instances = 2; }
message ListModulesRequest { abi.common.v1.CallContext context = 1; uint32 limit = 2; string after_instance_id = 3; }
message ListModulesResponse { abi.common.v1.CallError error = 1; repeated Instance instances = 2; string next_after_instance_id = 3; }

// Platform administration: remove a registration now (a crashed or stuck
// instance). Needs discovery:Evict on the instance's module. A live
// instance's next renewal fails with LEASE_EXPIRED and it re-registers under a
// new instance id; stop its process to keep it out.
message EvictRequest { abi.common.v1.CallContext context = 1; string instance_id = 2; }
message EvictResponse { abi.common.v1.CallError error = 1; Instance instance = 2; }

// Private persistence envelope; never returned by discovery lookup RPCs.
message RegistryRecord {
  Instance instance = 1;
  string owner = 2;
  string lease_hash = 3;
  bool initialized = 4;
  bool draining = 5;
  string rollout_id = 6;
  double registered_at = 7;
  repeated string rollout_modules = 8;
}
message RegistryState { repeated RegistryRecord records = 1; }

// Provider authenticates the incoming caller without receiving a signing key.
// Each Authorize* call is a lease check (the provider's registration is live,
// the target is declared and READY) and an authorization check: discovery
// verifies the caller's token, applies its on-behalf-of user as a kernel
// endpoint does, and asks IAM whether that caller may perform the operation.
message AuthorizeAgentRequest {
  abi.common.v1.CallContext context = 1;
  string instance_id = 2;
  string lease_token = 3;
  string agent_name = 4;
  string caller_token = 5;
  bool new_invocation = 6;
  // The caller's Abi-On-Behalf-Of header, as the provider received it.
  string caller_on_behalf_of = 7;
  // "submit", "status", "event" or "cancel". Empty: an older provider, which
  // checks run ownership itself (submit when new_invocation).
  string operation = 8;
  // For status, event and cancel: the run asked about, and the owner the
  // provider recorded for it (the caller_identity discovery gave its submit).
  string invocation_id = 9;
  string run_owner = 10;
}
message AuthorizeAgentResponse {
  abi.common.v1.CallError error = 1;
  // Who owns the runs this caller starts: the user it acts for, else itself.
  string caller_identity = 2;
  // Deprecated, always false: discovery decides who may read or cancel a run
  // (discovery:GetAgentRun, discovery:CancelAgentRun).
  bool caller_admin = 3;
  // Discovery decided on the run itself (IAM): the provider serves the poll
  // whoever owns the run. False: the provider allows its owner only.
  bool run_authorized = 4;
}
message AuthorizeModelRequest {
  abi.common.v1.CallContext context = 1;
  string instance_id = 2;
  string lease_token = 3;
  string model_name = 4;
  string caller_token = 5;
  string caller_on_behalf_of = 6;
}
message AuthorizeModelResponse {
  abi.common.v1.CallError error = 1;
  string caller_identity = 2;
  bool caller_admin = 3;  // Deprecated, always false.
}
message AuthorizeAppRequest {
  abi.common.v1.CallContext context = 1;
  string instance_id = 2;
  string lease_token = 3;
  string app_name = 4;
  string caller_token = 5;
  string caller_on_behalf_of = 6;
}
message AuthorizeAppResponse {
  abi.common.v1.CallError error = 1;
  string caller_identity = 2;
  bool caller_admin = 3;  // Deprecated, always false.
  // The user the verified caller acts for; empty for a caller acting for nobody.
  string caller_user_id = 4;
}
// A job host asks before it runs a manual trigger or honours a cancel: the
// caller's token travels on the trigger message, which may be consumed long
// after it was stored, so the token is checked as of stored_at.
message AuthorizeJobRequest {
  abi.common.v1.CallContext context = 1;
  string instance_id = 2;
  string lease_token = 3;
  string job_name = 4;
  // "trigger" or "cancel".
  string operation = 5;
  // For cancel: the run asked about.
  string run_id = 6;
  string caller_token = 7;
  string caller_on_behalf_of = 8;
  // When JetStream stored the trigger, in seconds since the epoch; zero: now.
  double stored_at = 9;
}
message AuthorizeJobResponse {
  abi.common.v1.CallError error = 1;
  string caller_identity = 2;
}
