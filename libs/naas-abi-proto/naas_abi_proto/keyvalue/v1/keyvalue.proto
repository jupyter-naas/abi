// NATS-RPC contract for the keyvalue kernel domain.
// Mirrors naas_abi_core/services/keyvalue/KeyValuePorts.py::IKeyValueAdapter 1:1.
// See docs/specs/rfcs/20260910_distributed-modules-nats-jetstream.md.
//
// Subjects (see "Protobuf contract shapes" in the RFC):
//   abi.svc.keyvalue.v1.get
//   abi.svc.keyvalue.v1.set
//   abi.svc.keyvalue.v1.set_if_not_exists
//   abi.svc.keyvalue.v1.delete
//   abi.svc.keyvalue.v1.delete_if_value_matches
//   abi.svc.keyvalue.v1.exists
//
// Scope of this v1 contract, deliberately: KeyValueService.lock() (a
// client-side @contextmanager composed purely from set_if_not_exists /
// delete_if_value_matches plus a local retry/backoff loop) has no endpoint
// of its own here -- it isn't part of IKeyValueAdapter, so there is nothing
// to contract. It keeps working transparently against a NATS-backed adapter
// once plugged in, with its two underlying calls simply going over the wire.
syntax = "proto3";

package abi.keyvalue.v1;

import "naas_abi_proto/common/v1/common.proto";

// Structured detail for a KV_LOCK_TIMEOUT CallError, echoing
// KeyValuePorts.KVLockTimeoutError's (key, attempts, timeout) fields so a
// caller can reconstruct the exact exception rather than a generic
// RuntimeError. Deliberately kept here, not in common.proto: this is
// specific to the keyvalue domain, not a shared envelope shape (see
// common.proto's CallError docstring for that split).
//
// KVLockTimeoutError is normally raised client-side by
// KeyValueService.lock(), never by IKeyValueAdapter itself -- no endpoint
// below can genuinely produce it. It is still mapped defensively on every
// response, the same way ObjectStoragePrimaryAdapterNATS defensively maps
// every known domain exception across every endpoint regardless of which
// ones can realistically raise it.
message KVLockTimeoutDetail {
  string key = 1;
  int32 attempts = 2;
  double timeout_seconds = 3;
}

message GetRequest {
  abi.common.v1.CallContext context = 1;
  string key = 2;
}
message GetResponse {
  oneof result {
    bytes value = 1;
    abi.common.v1.CallError error = 2;
  }
  optional KVLockTimeoutDetail lock_timeout_detail = 3;
}

message SetRequest {
  abi.common.v1.CallContext context = 1;
  string key = 2;
  bytes value = 3;
  optional int64 ttl = 4;
}
message SetResponse {
  // Empty on success — the error, if any, is the whole signal.
  optional abi.common.v1.CallError error = 1;
  optional KVLockTimeoutDetail lock_timeout_detail = 2;
}

message SetIfNotExistsRequest {
  abi.common.v1.CallContext context = 1;
  string key = 2;
  bytes value = 3;
  optional int64 ttl = 4;
}
message SetIfNotExistsResponse {
  oneof result {
    bool ok_value = 1;
    abi.common.v1.CallError error = 2;
  }
  optional KVLockTimeoutDetail lock_timeout_detail = 3;
}

message DeleteRequest {
  abi.common.v1.CallContext context = 1;
  string key = 2;
}
message DeleteResponse {
  optional abi.common.v1.CallError error = 1;
  optional KVLockTimeoutDetail lock_timeout_detail = 2;
}

message DeleteIfValueMatchesRequest {
  abi.common.v1.CallContext context = 1;
  string key = 2;
  bytes value = 3;
}
message DeleteIfValueMatchesResponse {
  oneof result {
    bool ok_value = 1;
    abi.common.v1.CallError error = 2;
  }
  optional KVLockTimeoutDetail lock_timeout_detail = 3;
}

message ExistsRequest {
  abi.common.v1.CallContext context = 1;
  string key = 2;
}
message ExistsResponse {
  oneof result {
    bool ok_value = 1;
    abi.common.v1.CallError error = 2;
  }
  optional KVLockTimeoutDetail lock_timeout_detail = 3;
}
