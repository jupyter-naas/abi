syntax = "proto3";
package abi.tool_registry.v1;
import "naas_abi_proto/common/v1/common.proto";

// The serving engine's tool catalog: list, get and search (read only, they never
// resolve a binding or return a configuration value), and invoke_tool, which runs
// a tool the engine holds.
//
// Subjects: abi.svc.tool_registry.v1.{list_tools,get_tool,search_tools,invoke_tool,cancel_tool}.
//
// Who is asking is the verified service identity, never the request: the scopes
// that decide what a caller may discover and run come from the engine's
// configuration for that identity. For the catalog reads CallContext's principal,
// workspace and tenant are carried but not read; for invoke_tool the engine honors
// the principal and the workspace only from its own processes (api, engine) and
// refuses them from any other caller. No field here grants rights. Unknown fields
// are ignored.
//
// Runtime validation is authoritative (Protovalidate tooling is not yet enabled);
// the limits are the primary's: query 1..2000 characters, search limit 1..50
// (default 5), list limit 1..200 (default 100), at most 32 module filters of 256
// characters and 16 tag filters of 64, a finite min_score, and a tool reference
// of at most 512 characters. A reply stays under half the broker's limit: a
// page or a result list is cut at the tool that would pass it (search says so with
// `truncated`), and a single
// definition above it is neither listed nor returned.
//
// ToolDefinition is the portable form of a published tool, shared by the
// steps that follow (tools published by SDK modules, running engine tools).
message ConfigRequirement {
  string key = 1;
  string description = 2;
  // The value is a credential: a requirement names it, never carries it.
  bool secret = 3;
  bool required = 4;
}
message ToolRequirements {
  repeated ConfigRequirement config = 1;
  bool requires_workspace = 2;
}
message ToolDefinition {
  // <namespace>/<name>@<version>; always the parts below joined.
  string id = 1;
  string namespace = 2;
  string name = 3;
  string version = 4;
  // The module that published it.
  string module = 5;
  string description = 6;
  // JSON Schema of the tool's input, as a UTF-8 JSON object with finite numbers.
  bytes input_schema_json = 7;
  // Empty when the tool declares none.
  bytes output_schema_json = 8;
  repeated string tags = 9;
  ToolRequirements requirements = 10;
  // The caller needs every one of these scopes to discover, enable or run it.
  repeated string required_scopes = 11;
  // Published by an SDK module and served by it (abi.tool.v1): the engine
  // runs it by calling the module, so its configuration holds no secret. Set by
  // the engine from the module's discovery descriptor; a module's own value is
  // ignored.
  bool remote = 12;
}
// Whether the tool could be built now, as the engine that owns it sees it: the
// required configuration keys that stay empty even with the publishing module's
// own values (which are never sent).
message ToolAvailability {
  bool available = 1;
  repeated string missing_config = 2;
}
message ToolEntry {
  ToolDefinition definition = 1;
  ToolAvailability availability = 2;
}
message ToolMatch {
  ToolEntry tool = 1;
  double score = 2;
}
// Narrows list and search; applied by the owner before the limit.
message ToolFilter {
  // The tool's module is one of these.
  repeated string modules = 1;
  // The tool has every one of these.
  repeated string tags = 2;
  bool available_only = 3;
}
message ListToolsRequest {
  abi.common.v1.CallContext context = 1;
  ToolFilter filter = 2;
  uint32 limit = 3;
  // The last id of the previous page (its next_after); ids come sorted.
  string after = 4;
}
message ListToolsResponse {
  repeated ToolEntry tools = 1;
  // Empty on the last page.
  string next_after = 2;
  abi.common.v1.CallError error = 15;
}
message GetToolRequest {
  abi.common.v1.CallContext context = 1;
  // <namespace>/<name> (the highest version) or <namespace>/<name>@<version>.
  string ref = 2;
}
message GetToolResponse {
  ToolEntry tool = 1;
  abi.common.v1.CallError error = 15;
}
message SearchToolsRequest {
  abi.common.v1.CallContext context = 1;
  string query = 2;
  uint32 limit = 3;
  optional double min_score = 4;
  ToolFilter filter = 5;
}
message SearchToolsResponse {
  // Best first.
  repeated ToolMatch matches = 1;
  // Matches were left out of this reply: too large to send, or past the reply's
  // size budget. A shorter list than the limit then does not mean the catalog
  // has no more. Asking for a larger limit gets back what was skipped, not what
  // the budget cut.
  bool truncated = 2;
  abi.common.v1.CallError error = 15;
}

// Run a tool the engine holds, on the engine: the tool, its configuration and
// the secrets it reads all stay in the engine process, and only JSON crosses the
// wire. The request has the fields, numbers and meaning of abi.tool.v1.InvokeToolRequest
// (the call to a tool a module serves) and one more, `secret_refs`; the response is
// abi.tool.v1.InvokeToolResponse's:
//   context        trace_id as usual; timeout_ms is the deadline (60 s when zero, at
//                  most 300 s: the SDK sets it from the time the caller waits);
//                  principal_id and workspace_id are honored from api and engine
//                  only, refused (PERMISSION_DENIED) from any other caller
//   tool           <namespace>/<name>, or <namespace>/<name>@<version>
//   version        the version when `tool` has none; empty: the highest. Both
//                  given must agree.
//   arguments_json a JSON object, validated against the tool's input schema
//   config_json    a JSON object of NON-secret configuration values for keys the
//                  tool's definition declares; a key it marks secret is refused
//                  here (PERMISSION_DENIED): a credential is never written inline
//   secret_refs    maps a configuration key the definition marks secret to the NAME
//                  of an engine secret. The engine resolves it, only when the caller's
//                  identity is allowed that name (`nats.tool_registry.invoke.modules.<id>.secrets`,
//                  denied by default; its own processes are not restricted), and the
//                  value is never put in a result, an error or a log.
//
// A tool that needs no scope is not run for an SDK module unless the operator
// lists it (`unscoped_tools`). A tool a module serves (ToolDefinition.remote) is
// not run here: call the module itself.
//
// Limits, enforced by the engine (no Protovalidate): a request of at most 512 KiB,
// arguments_json at most 256 KiB, config_json at most 64 KiB, at most 16 secret_refs
// whose names are at most 128 characters, a result of at most 512 KiB, and a
// configurable number of calls at once (the rest get RESOURCE_EXHAUSTED, retryable).
// Errors carry a stable code and a message that holds no secret and none of the
// tool's internals:
//   UNAUTHENTICATED, PERMISSION_DENIED, TOOL_NOT_FOUND, INVALID_ARGUMENT,
//   PAYLOAD_TOO_LARGE, RESOURCE_EXHAUSTED, DEADLINE_EXCEEDED, CANCELLED, TOOL_ERROR.
// A tool's own failure is TOOL_ERROR; only a message it wrote for its caller (a
// ToolException) is returned, scrubbed of the secrets of the call.
message InvokeToolRequest {
  abi.common.v1.CallContext context = 1;
  string tool = 2;
  string version = 3;
  bytes arguments_json = 4;
  bytes config_json = 5;
  map<string, string> secret_refs = 6;
  // Names this call for CancelToolRequest (the same rules as abi.tool.v1: 1..128
  // characters of letters, digits, `_` and `-`, unique among the caller's running
  // calls); empty: the call cannot be cancelled and runs to its deadline.
  string call_id = 7;
}
message InvokeToolResponse {
  // Any JSON value (UTF-8, finite numbers); empty when the call failed.
  bytes result_json = 1;
  abi.common.v1.CallError error = 15;
}

// Stop a call that invoke_tool is running, as the caller that started it (the verified
// identity decides: another identity's id, an unknown id and a finished call all answer
// `cancelled = false`). The engine cancels a tool that has a coroutine at its next
// await and answers the call with CANCELLED; a synchronous tool is told through
// `naas_abi_sdk.cancellation.current_cancellation()` and cannot be interrupted. A cancel
// that arrives before its call is registered is kept for 30 seconds.
message CancelToolRequest {
  abi.common.v1.CallContext context = 1;
  string call_id = 2;
}
message CancelToolResponse {
  bool cancelled = 1;
  abi.common.v1.CallError error = 15;
}
