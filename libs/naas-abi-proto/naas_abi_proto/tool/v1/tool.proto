syntax = "proto3";
package abi.tool.v1;
import "naas_abi_proto/common/v1/common.proto";

// Running a tool that a module serves. The tool's definition is the portable
// abi.tool_registry.v1.ToolDefinition, declared in the module's discovery
// descriptor; this file is only the call.
//
// Subject: abi.mod.<project>.<instance>.tool.<name>.invoke, a unary request to
// one ready instance of the module (the caller's token is bound to it). The
// module asks discovery to authorize the caller (AuthorizeToolRequest) and may
// refuse it. Nothing here carries a binding, a callable or a pickle, and no
// field carries an engine secret: `config_json` holds values the caller wrote
// in plain, for a tool whose requirements are not secret.
//
// Limits, enforced by the serving module (no Protovalidate): a request of at
// most 512 KiB as sent, `arguments_json` of at most 256 KiB, `config_json` of
// at most 64 KiB, a result of at most 512 KiB. Arguments are validated against
// the declared input schema before the handler runs. The handler's deadline is
// `context.timeout_ms` (the time the caller waits), at most 300 seconds, 60
// when it is zero. An error carries a stable code and a message that holds no
// detail of the handler's failure:
//   UNAUTHENTICATED, PERMISSION_DENIED, TOOL_NOT_FOUND, MODULE_UNAVAILABLE,
//   INVALID_ARGUMENT, PAYLOAD_TOO_LARGE, DEADLINE_EXCEEDED, CANCELLED, TOOL_ERROR.
// abi.tool_registry.v1.InvokeToolRequest repeats these fields, with the same numbers,
// for running a tool the engine holds, and adds `secret_refs`. Here there is none: no
// secret reaches a module.
// Cancelling: a request may carry a `call_id` (1..128 characters of letters, digits,
// `_` and `-`, chosen by the caller and unique among its running calls). The caller
// that gives up (its own caller went away, or its wait ran out) sends a CancelToolRequest
// with that id to the same instance, on abi.mod.<project>.<instance>.tool.<name>.cancel,
// with a token like the call's. Only the identity that started a call can cancel it: an
// unknown id, an id of another identity and a finished call all answer `cancelled =
// false`, which tells nothing about other callers' calls. The module stops the handler
// (an async handler is cancelled at its next await; a synchronous one is told through
// `ToolCall.cancellation` and cannot be interrupted) and answers the call itself with
// CANCELLED. Without a `call_id` a call runs to its deadline. A cancel that arrives
// before its call is registered is kept for 30 seconds and applied when the call is.
// `context.principal_id` names the end user the call is for: a module honors it
// only from the engine's own processes (api, engine) and refuses it from any
// other caller.
message InvokeToolRequest {
  abi.common.v1.CallContext context = 1;
  // The tool's name, as declared. Must be the one in the subject.
  string tool = 2;
  // The declared version the caller means; empty: the declared one.
  string version = 3;
  // A JSON object, validated against the tool's input schema.
  bytes arguments_json = 4;
  // A JSON object of non-secret configuration values; empty: none.
  bytes config_json = 5;
  reserved 6;
  // Names this call for CancelToolRequest; empty: the call cannot be cancelled.
  string call_id = 7;
}
message InvokeToolResponse {
  // Any JSON value (UTF-8, finite numbers); empty when the call failed.
  bytes result_json = 1;
  abi.common.v1.CallError error = 15;
}

// Stop a running call. Errors: UNAUTHENTICATED, INVALID_ARGUMENT (a malformed call_id).
message CancelToolRequest {
  abi.common.v1.CallContext context = 1;
  string call_id = 2;
}
message CancelToolResponse {
  // A call of the caller's with that id was running and has been told to stop.
  bool cancelled = 1;
  abi.common.v1.CallError error = 15;
}
