// -- groups ------------------------------------------------------------------------

message CreateGroupRequest {
  abi.common.v1.CallContext context = 1;
  string name = 2;
  // Alone: the group belongs to the org, abi:<org>:-.
  optional string org = 3;
  // The owner: abi:-:- (the default), abi:<org>:- or abi:<org>:<ws>.
  optional string scope = 4;
