// NATS-RPC contract for the activity_log kernel domain.
// Mirrors naas_abi_core/services/activity_log/ActivityLogPort.py::IActivityLogAdapter
// 1:1. See docs/specs/rfcs/20260910_distributed-modules-nats-jetstream.md.
//
// Subjects (see "Protobuf contract shapes" in the RFC):
//   abi.svc.activity_log.v1.record
//   abi.svc.activity_log.v1.query
//   abi.svc.activity_log.v1.list_actors
//   abi.svc.activity_log.v1.shutdown
syntax = "proto3";

package abi.activity_log.v1;

import "naas_abi_proto/common/v1/common.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

message ActivityEvent {
  string actor_id = 1;
  string event_type = 2;
  // Always set on the wire: the port default-factories `datetime.now(UTC)`
  // when the caller doesn't supply one, so there is no "unset" case to
  // track presence for here (unlike since/until on ActivityLogQueryFilter
  // below, which really can be absent).
  google.protobuf.Timestamp timestamp = 3;
  optional string correlation_id = 4;
  // dict[str, Any] on the port -- arbitrary caller-supplied JSON-shaped
  // data, never enumerated by the domain. See the RFC's "Protobuf contract
  // shapes" for why Struct is the right fit for this one field rather than
  // a typed message, while the rest of the contract stays fully typed.
  google.protobuf.Struct attributes = 5;
}

// Named `filter`, not `query`, to avoid a name clash with the RPC method
// this is embedded in (`QueryRequest`) -- ActivityLogPort.query()'s second
// positional parameter is itself named `query`, which would be confusing
// reused as a field/message name on the wire too.
message ActivityLogQueryFilter {
  optional string event_type = 1;
  optional google.protobuf.Timestamp since = 2;
  optional google.protobuf.Timestamp until = 3;
  optional int32 limit = 4;
}

message RecordRequest {
  abi.common.v1.CallContext context = 1;
  ActivityEvent event = 2;
}
message RecordResponse {
  // Empty on success — the error, if any, is the whole signal.
  optional abi.common.v1.CallError error = 1;
}

message QueryRequest {
  abi.common.v1.CallContext context = 1;
  string actor_id = 2;
  optional ActivityLogQueryFilter filter = 3;
}
message QueryResponse {
  oneof result {
    ActivityEvents events = 1;
    abi.common.v1.CallError error = 2;
  }
}

message ActivityEvents {
  repeated ActivityEvent events = 1;
}

message ListActorsRequest {
  abi.common.v1.CallContext context = 1;
}
message ListActorsResponse {
  oneof result {
    Actors actors = 1;
    abi.common.v1.CallError error = 2;
  }
}

message Actors {
  repeated string actors = 1;
}

// Remoting a "shut down my local adapter resources" call is a little
// unusual for an RPC target -- there is no meaningful cross-process action
// a client should trigger on demand this way. Included anyway for a
// complete 1:1 mirror of IActivityLogAdapter; see
// ActivityLogPrimaryAdapterNATS's docstring for how it's handled
// server-side.
message ShutdownRequest {
  abi.common.v1.CallContext context = 1;
}
message ShutdownResponse {
  optional abi.common.v1.CallError error = 1;
}
