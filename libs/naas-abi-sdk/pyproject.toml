[project]
name = "naas-abi-sdk"
version = "0.1.0"
description = "Standalone ABI sdk package"
requires-python = ">=3.10"
dependencies = ["naas-abi-proto>=0.1.0,<0.2", "nats-py>=2.16.0,<3"]
readme = "README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff"]

[tool.uv.sources]
naas-abi-proto = {path = "../naas-abi-proto", editable = true}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["**/*_pb2.py", "**/*_pb2.pyi"]

[project.scripts]
naas-abi-module = "naas_abi_sdk.module_runner:main"

[project.optional-dependencies]
models = ["langchain-core>=0.3.78,<2"]
agents = ["langchain-core>=1,<2"]
rdf = ["rdflib>=7,<8"]
langgraph = ["langgraph-checkpoint>=3.0.1,<4"]
# Agents written like naas_abi_core agents (naas_abi_sdk.agents).
agent = ["langchain-core>=1,<2", "langgraph>=1,<2", "langgraph-checkpoint>=3.0.1,<4"]
# OpenTelemetry tracing over NATS (W3C trace context in message headers).
otel = [
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]

[tool.semantic_release]
commit_parser = "conventional-monorepo"
commit_message = """\
chore(release): naas-abi-sdk@{version}`

Automatically generated by python-semantic-release
"""
tag_format = "naas-abi-sdk-v{version}"
version_toml = ["pyproject.toml:project.version"]
# Stay on 0.x: the first release is 0.1.0 (PSR 10 would start at 1.0.0), and a
# breaking change bumps the minor until the API is declared stable.
allow_zero_version = true
major_on_zero = false
build_command = """
    python -m pip install uv>=0.9.13
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""

[tool.semantic_release.commit_parser_options]
path_filters = ["."]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.dev]
match = "^dev"
prerelease = true
prerelease_token = "dev"
