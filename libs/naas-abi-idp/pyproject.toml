[project]
name = "naas-abi-idp"
version = "0.1.0"
description = "The built-in OIDC identity provider of ABI: an SDK module that runs over NATS"
requires-python = ">=3.10"
# Core-free: the SDK, the proto package and what the provider itself needs.
dependencies = [
    "naas-abi-sdk>=0.1.0",
    "naas-abi-proto>=0.1.0",
    "authlib>=1.6,<2",
    "cryptography>=43",
    "starlette>=0.40",
]
readme = "README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff", "httpx>=0.27", "uvicorn>=0.30"]

[tool.uv.sources]
naas-abi-proto = {path = "../naas-abi-proto", editable = true}
naas-abi-sdk = {path = "../naas-abi-sdk", editable = true}

[project.scripts]
naas-abi-idp = "naas_abi_idp.__main__:main"

[tool.semantic_release]
commit_parser = "conventional-monorepo"
commit_message = """\
chore(release): naas-abi-idp@{version}`

Automatically generated by python-semantic-release
"""
tag_format = "naas-abi-idp-v{version}"
version_toml = ["pyproject.toml:project.version"]
# Stay on 0.x, like the SDK it is built on: the first release is 0.1.0, and a
# breaking change bumps the minor until the API is declared stable.
allow_zero_version = true
major_on_zero = false
build_command = """
    python -m pip install uv>=0.9.13
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""

[tool.semantic_release.commit_parser_options]
path_filters = ["."]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.dev]
match = "^dev"
prerelease = true
prerelease_token = "dev"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:authlib.*"]

[tool.ruff]
target-version = "py310"
