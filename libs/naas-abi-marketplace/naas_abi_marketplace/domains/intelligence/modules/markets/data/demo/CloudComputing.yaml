market:
  label: Cloud Computing
  key: cloud-computing
  definition: >-
    On-demand computing, storage, networking and software delivered over the
    internet and billed by use: infrastructure, platform and software services,
    on shared (public) or dedicated (private) infrastructure.

segmentation:
  period: "2026"
  source:
    title: Cloud Computing market map (curated seed)
    publisher: bob markets module
    date: 2026-10-06
  segments:
    - label: Cloud Infrastructure / IaaS (Infrastructure-as-a-Service)
      key: iaas
      criterion: Service model
      definition: Compute, storage and networking rented by the hour or by use.
    - label: Public Cloud
      key: public-cloud
      criterion: Deployment model
      definition: Cloud services run on infrastructure shared between customers.
    - label: Private Cloud
      key: private-cloud
      criterion: Deployment model
      definition: Cloud services run on infrastructure dedicated to one customer, hosted or on premises.
    - label: Web Hosting / Web Cloud
      key: web-hosting
      criterion: Workload
      definition: Hosting of websites, domains and email for businesses and individuals.
    - label: Cloud Data Centers
      key: cloud-data-centers
      criterion: Value chain layer
      definition: Colocation and wholesale data center capacity that cloud providers and enterprises run their infrastructure in.
    - label: AI infrastructure / GPU cloud
      key: gpu-cloud
      criterion: Workload
      parents: [iaas, public-cloud]
      definition: GPU capacity rented for AI training and inference.

