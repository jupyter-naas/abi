swot:
  # Findings the Synergy Research Group article states.
  - market: iaas
    analyst: Synergy Research Group
    region: Global
    period: Q3 2025
    source:
      title: "Cloud Market Share Trends - Big Three Together Hold 63% while Oracle and the Neoclouds Inch Higher"
      url: https://srgresearch.com/articles/cloud-market-share-trends-big-three-together-hold-63-while-oracle-and-the-neoclouds-inch-higher
      publisher: Synergy Research Group
      date: 2025-11-19
    opportunities:
      - Cloud infrastructure services revenue grew about 60% in two years, to USD 106.9 billion in Q3 2025.
      - AI and GPU services let neoclouds such as CoreWeave, Nebius, Lambda and Crusoe gain share.
    threats:
      - Amazon, Microsoft and Google hold 63% of the market between them, leaving smaller providers to compete for the rest.
    strengths:
      - {organization: Amazon, statement: "Market leader with 29% of worldwide cloud infrastructure services in Q3 2025."}
      - {organization: Google, statement: "Nearly four times the size of fourth-placed Alibaba."}
    weaknesses:
      - {organization: Amazon, statement: "Its market share has eroded from over 32% in 2021 to 29% in Q3 2025."}
  # This seed's own assessment, to be reviewed and replaced by sourced findings.
  - market: cloud-computing
    region: Europe
    period: "2026"
    source:
      title: Cloud Computing market map (curated seed)
      publisher: bob markets module
      date: 2026-10-06
    opportunities:
      - Data sovereignty requirements push European public buyers and regulated industries towards European providers.
    threats:
      - Power and grid capacity limit how fast new data centers can be built.
      - GPU cloud capacity depends on a concentrated supply of accelerators.
    strengths:
      - {organization: OVHcloud, statement: "Designs and builds its own servers and runs its own data centers, which keeps unit costs low."}
    weaknesses:
      - {organization: OVHcloud, statement: "A much smaller scale and catalogue of managed services than the US hyperscalers."}
