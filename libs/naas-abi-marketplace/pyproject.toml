[project]
name = "naas-abi-marketplace"
version = "3.64.1"
authors = [{ name = "Grace Lambert", email = "maxime@naas.ai" },{ name = "Alice Dupont", email = "florent@naas.ai" }, { name = "Emma Petit", email = "jeremy@naas.ai" }]
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "naas-abi-core>=1.4.0",
    # ijson is used by XFileIngestionPipeline to stream-parse multi-GB
    # JSON tweet dumps without buffering the whole array in memory.
    "ijson>=3.2.0",
    "pyyaml>=6.0.3",
]
license = { text = "MIT License" }

[project.urls]
Homepage = "https://github.com/jupyter-naas/abi"
Repository = "https://github.com/jupyter-naas/abi/tree/main/libs/naas-abi-marketplace"

[tool.uv.sources]
naas-abi-proto = {path = "../naas-abi-proto", editable = true}
naas-abi-core = { path = "../naas-abi-core", editable = true }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.mypy]

[[tool.mypy.overrides]]
module = ["naas_abi.*"]
ignore_missing_imports = true

# domains/ is excluded from the type check (Makefile, check-marketplace). An
# application that builds on a domain's vocabulary (the LinkedIn connections
# pipeline uses the people module's graph builders) must not pull it back in.
[[tool.mypy.overrides]]
module = ["naas_abi_marketplace.domains.*"]
follow_imports = "silent"

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pytest>=9.0.1",
    "python-semantic-release>=9.21.0",
    # The X and PubMed orchestrations import Dagster, a legacy extra of core
    # since 3.0: type-check them without making it a dependency.
    "naas-abi-core[dagster]",
]

[tool.semantic_release]
commit_parser = "conventional-monorepo"
commit_message = """\
chore(release): naas-abi-marketplace@{version}`

Automatically generated by python-semantic-release
"""
tag_format = "naas-abi-marketplace-v{version}"
version_toml = ["pyproject.toml:project.version"]
build_command = """
    python -m pip install uv>=0.9.13
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""
[tool.semantic_release.commit_parser_options]
path_filters = ["."]
# scope_prefix = "naas-abi-marketplace-"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.dev]
match = "^dev"
prerelease = true
prerelease_token = "dev"

[project.optional-dependencies]
ai-bedrock = [
    "langchain-aws>=0.2.10",
]
ai-chatgpt = [
    "pdfplumber>=0.11.8",
]
ai-claude = [
    "langchain-anthropic>=0.3.17",
]
ai-deepseek = [
    "langchain-ollama>=0.3.4",
]
ai-gemini = [
    "langchain-google-genai>=2.1.4",
]
ai-gemma = [
    "langchain-ollama>=0.3.4",
]
ai-grok = [
    "langchain-xai>=0.2.5",
]
ai-llama = [
    "langchain-ollama>=0.3.4",
]
ai-mistral = [
    "langchain-mistralai>=0.2.11",
]
ai-ollama = [
    "langchain-ollama>=0.3.4",
]
# The openrouter gateway speaks the OpenAI wire protocol, so langchain-openai
# (already a naas-abi-core dependency) is all it needs. The extra exists so a
# generated project can name the module it enables.
ai-openrouter = []
ai-perplexity = [
    "langchain-perplexity>=0.1.2",
]
ai-qwen = [
    "langchain-ollama>=0.3.4",
]
applications-bodo = [
    # The agent runs Python that imports bodo.pandas (was boto3: a typo).
    "bodo>=2026.11",
]
applications-git = []
applications-naas = []
applications-x = []
# GitHubIntegration (support) encrypts repository secrets with it.
domains-support = [
    "pynacl>=1.5.0,<2"
]
domains-ontology-engineer = [
    "thefuzz==0.22.1",
    "fuzzywuzzy-stubs==0.0.1"
]
domains-document = [
    "beautifulsoup4>=4.12.0",
    "pymupdf>=1.27.2.2",
    "pymupdf4llm>=1.27.2.2",
    "docling>=2.0.0",
    # Listed only so [tool.uv.sources] can pin them to the CPU-only PyTorch
    # index: docling pulls them transitively, and the default PyPI wheels
    # bring ~4.4 GB of CUDA libraries (nvidia-*, triton) we never use.
    "torch",
    "torchvision",
]
