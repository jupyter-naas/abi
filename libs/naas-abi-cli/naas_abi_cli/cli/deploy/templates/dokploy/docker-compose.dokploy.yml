# =============================================================================
# ABI on Dokploy: generated by `abi deploy dokploy`. Rerun it to refresh this
# file; edit the variables in Dokploy's Environment tab, not here.
# =============================================================================
# Dokploy's Traefik is the edge: it binds 80/443, issues the certificates and
# routes by host through the labels below, on the external `dokploy-network`.
# No service publishes a host port. Dokploy builds `abi` from the project
# Dockerfile on every deploy, so the image carries the code (no source mount).
#
# Every value comes from the Environment tab, which Dokploy writes to `.env`
# next to this file. `abi deploy dokploy` generates a starting set in
# .env.dokploy. Guide: https://github.com/jupyter-naas/abi/blob/main/docs/site/docs/user-guide/deploy/dokploy.md
#
# Several stacks can share a server, and the services Traefik reaches (abi,
# nexus-web{% if INCLUDE_CODING %}, coder, forgejo{% endif %}) join `dokploy-network` under their service
# names, which every stack shares. Calls between them therefore use the
# stack-unique aliases `${ABI_STACK_NAME}-<service>`, which exist only on this
# stack's own network.
{% if NATS %}
# NATS mode: kernel services, the bus (JetStream), module jobs and discovery go
# through the `nats` service. The engine reads config.dokploy.yaml.
{% else %}
# Classic mode: RabbitMQ bus and Dagster. The engine reads config.dokploy.yaml.
{% endif %}
# =============================================================================

x-abi-template: &abi_template
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  # The whole Environment tab, so keys the config reads as `{{ '{{' }} secret.X {{ '}}' }}`
  # (OPENROUTER_API_KEY, NEXUS_USER_*, ...) reach the engine. They win over
  # every secrets file in config.dokploy.yaml.
  env_file:
    - path: .env
      required: false
  environment:
    # Selects config.dokploy.yaml, derived from config.local.yaml.
    - ENV=dokploy
    - LOG_LEVEL=${LOG_LEVEL:-INFO}
    - PYTHONPATH=/app
    - POSTGRES_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
    - VECTOR_STORE_ADAPTER=qdrant
    - QDRANT_HOST=qdrant
    - QDRANT_PORT=${QDRANT_PORT}
{% if INCLUDE_CODING %}
    # The network Coder attaches workspaces to (so they reach forgejo:3000 and
    # coderd), and the public git base for clone URLs.
    - CODING_WORKSPACE_DOCKER_NETWORK=${ABI_STACK_NAME}-abi-network
    - CODING_GIT_PUBLIC_BASE=https://git.${PUBLIC_WEB_HOST}
{% endif %}
  volumes:
    - huggingface_cache:/root/.cache/huggingface  # Docling / HF model weights
    # The writable dotenv secret file (config.dokploy.yaml): what the engine
    # stores at runtime outlives a redeploy.
    - abi_secrets:{{ SECRETS_DIR }}
{% if INCLUDE_CODING %}
    # Admin tokens minted by coding-init; config.dokploy.yaml reads this file
    # as a read-only dotenv secret adapter.
    - coding_secrets:{{ CODING_SECRETS_DIR }}:ro
{% endif %}
  depends_on:
    postgres:
      condition: service_healthy
{% if NATS %}
    nats:
      condition: service_healthy
{% else %}
    rabbitmq:
      condition: service_healthy
{% endif %}
    qdrant:
      condition: service_healthy
    redis:
      condition: service_healthy
    fuseki:
      condition: service_healthy
    minio:
      condition: service_healthy
{% if INCLUDE_CODING %}
    # Wait for the coding bootstrap, so the minted tokens are on the
    # coding_secrets volume when the engine reads its config.
    coding-init:
      condition: service_completed_successfully
{% endif %}
  healthcheck:
    test: ["CMD-SHELL", "for i in 1 2 3; do curl -fsS http://localhost:9879/ >/dev/null || exit 1; sleep 2; done"]
    interval: 10s
    timeout: 15s
    start_period: 60s
    retries: 30

services:
  nexus-web:
    image: ${NEXUS_WEB_IMAGE}:${NEXUS_WEB_TAG}
    pull_policy: always
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_NEXUS_ENV=local
      - NEXUS_API_URL=${NEXUS_API_URL}
      - NEXT_PUBLIC_API_URL=${NEXUS_API_URL}
      - NEXUS_INTERNAL_API_URL=http://${ABI_STACK_NAME}-abi:9879
      - NEXT_PUBLIC_SITE_URL=https://${PUBLIC_WEB_HOST}
      - NEXT_PUBLIC_WS_PATH=/ws/socket.io
      - DEFAULT_WORKSPACE=${NEXUS_DEFAULT_WORKSPACE:-primary}
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # Plain HTTP on every host of this stack goes to HTTPS (Dokploy's
      # redirect-to-https middleware).
{% if INCLUDE_CODING %}
      - traefik.http.routers.${ABI_STACK_NAME}-http.rule=Host(`${PUBLIC_WEB_HOST}`) || Host(`${PUBLIC_API_HOST}`) || Host(`coder.${PUBLIC_WEB_HOST}`) || HostRegexp(`^[a-z0-9-]+\.coder\.${PUBLIC_WEB_HOST}$$`) || Host(`git.${PUBLIC_WEB_HOST}`)
{% else %}
      - traefik.http.routers.${ABI_STACK_NAME}-http.rule=Host(`${PUBLIC_WEB_HOST}`) || Host(`${PUBLIC_API_HOST}`)
{% endif %}
      - traefik.http.routers.${ABI_STACK_NAME}-http.entrypoints=web
      - traefik.http.routers.${ABI_STACK_NAME}-http.middlewares=redirect-to-https@file
      - traefik.http.routers.${ABI_STACK_NAME}-http.service=${ABI_STACK_NAME}-web
      - traefik.http.routers.${ABI_STACK_NAME}-web.rule=Host(`${PUBLIC_WEB_HOST}`)
      - traefik.http.routers.${ABI_STACK_NAME}-web.entrypoints=websecure
      - traefik.http.routers.${ABI_STACK_NAME}-web.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.${ABI_STACK_NAME}-web.priority=10
      - traefik.http.routers.${ABI_STACK_NAME}-web.service=${ABI_STACK_NAME}-web
      - traefik.http.services.${ABI_STACK_NAME}-web.loadbalancer.server.port=3000
    networks:
      abi-network:
        aliases:
          - ${ABI_STACK_NAME}-nexus-web
      dokploy-network: {}

  # -----------------------------------------------------------------------------
  # ABI Main Service - engine, REST API and Nexus API
  # -----------------------------------------------------------------------------
  abi:
    <<: *abi_template
    # Creates the secrets files and adds the config's secrets that have no
    # value yet to the abi_secrets file, empty, so a first boot starts.
    command:
      - sh
      - -c
      - '{{ SECRETS_SETUP }} && exec uv run --no-dev python -m naas_abi_core.apps.api.api'
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # The API host.
      - traefik.http.routers.${ABI_STACK_NAME}-api.rule=Host(`${PUBLIC_API_HOST}`)
      - traefik.http.routers.${ABI_STACK_NAME}-api.entrypoints=websecure
      - traefik.http.routers.${ABI_STACK_NAME}-api.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.${ABI_STACK_NAME}-api.service=${ABI_STACK_NAME}-abi
      # Same-origin /app-html/ on the web host, ahead of the nexus-web route.
      - traefik.http.routers.${ABI_STACK_NAME}-app-html.rule=Host(`${PUBLIC_WEB_HOST}`) && PathPrefix(`/app-html/`)
      - traefik.http.routers.${ABI_STACK_NAME}-app-html.entrypoints=websecure
      - traefik.http.routers.${ABI_STACK_NAME}-app-html.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.${ABI_STACK_NAME}-app-html.priority=100
      - traefik.http.routers.${ABI_STACK_NAME}-app-html.service=${ABI_STACK_NAME}-abi
      - traefik.http.services.${ABI_STACK_NAME}-abi.loadbalancer.server.port=9879
    networks:
      abi-network:
        aliases:
          - ${ABI_STACK_NAME}-abi
      dokploy-network: {}

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      abi:
        condition: service_healthy
    command:
      ["uv", "run", "--no-dev", "python", "-m", "naas_abi_core.apps.mcp.mcp_server"]
    environment:
      - ABI_API_BASE=http://${ABI_STACK_NAME}-abi:9879
      - ABI_API_KEY=${ABI_API_KEY}
      - MCP_TRANSPORT=http
    networks:
      - abi-network

  # -----------------------------------------------------------------------------
  # PostgreSQL - agent memory, Nexus, ducklake catalog{% if INCLUDE_CODING %}, Coder and Forgejo{% endif %}

  # -----------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./.deploy/docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - abi-network

  # -----------------------------------------------------------------------------
  # Apache Jena Fuseki (TDB2) - knowledge graph (RDF/SPARQL)
  # -----------------------------------------------------------------------------
  fuseki:
    image: stain/jena-fuseki:latest
    restart: unless-stopped
    volumes:
      - fuseki_data:/fuseki
    # Keep mem_limit above JVM_ARGS -Xmx: TDB2 memory-maps its files off-heap.
    mem_limit: 4g
    environment:
      - ADMIN_PASSWORD=${FUSEKI_ADMIN_PASSWORD}
      - JVM_ARGS=-Xmx2g
    command: >-
      bash -c '
      mkdir -p /fuseki/configuration /fuseki/databases/ds &&
      printf "@prefix :        <#> .
      @prefix fuseki:  <http://jena.apache.org/fuseki#> .
      @prefix rdf:     <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .
      @prefix ja:      <http://jena.hpl.hp.com/2005/11/Assembler#> .
      @prefix tdb2:    <http://jena.apache.org/2016/tdb#> .

      :service rdf:type fuseki:Service ;
          fuseki:name \"ds\" ;
          fuseki:endpoint [ fuseki:operation fuseki:query ;
                            fuseki:name \"sparql\" ;
                            ja:context [ ja:cxtName \"tdb:unionDefaultGraph\" ;
                                         ja:cxtValue true ] ] ;
          fuseki:endpoint [ fuseki:operation fuseki:query ;
                            fuseki:name \"query\" ;
                            ja:context [ ja:cxtName \"tdb:unionDefaultGraph\" ;
                                         ja:cxtValue true ] ] ;
          fuseki:endpoint [ fuseki:operation fuseki:update ;
                            fuseki:name \"update\" ] ;
          fuseki:endpoint [ fuseki:operation fuseki:gsp-r ;
                            fuseki:name \"get\" ] ;
          fuseki:endpoint [ fuseki:operation fuseki:gsp-rw ;
                            fuseki:name \"data\" ] ;
          fuseki:dataset :dataset .

      :dataset rdf:type tdb2:DatasetTDB2 ;
          tdb2:location \"/fuseki/databases/ds\" .
      " > /fuseki/configuration/ds.ttl &&
      /jena-fuseki/fuseki-server'
    healthcheck:
      # Probe the dataset, not the web root (see the local compose for details).
      test: ["CMD-SHELL", "curl -fsS -u admin:$$ADMIN_PASSWORD 'http://localhost:3030/ds/query?query=ASK%20%7B%20%3Fs%20%3Fp%20%3Fo%20%7D' >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - abi-network

  # Periodic TDB2 compaction (deleteOld=true) to reclaim disk.
  fuseki-compact:
    image: curlimages/curl:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - fuseki
    environment:
      - ADMIN_PASSWORD=${FUSEKI_ADMIN_PASSWORD}
      - COMPACT_INTERVAL_SECONDS=${FUSEKI_COMPACT_INTERVAL_SECONDS}
    entrypoint: /bin/sh
    command: >-
      -c 'while true; do
            sleep "$$COMPACT_INTERVAL_SECONDS";
            echo "[fuseki-compact] triggering TDB2 compaction (deleteOld=true)...";
            curl -fsS -u "admin:$$ADMIN_PASSWORD" -X POST "http://fuseki:3030/$$/compact/ds?deleteOld=true"
              || echo "[fuseki-compact] compaction request failed";
          done'
    networks:
      - abi-network

{% if not NATS %}
  # -----------------------------------------------------------------------------
  # Dagster - workflow orchestration (internal only, not routed)
  # -----------------------------------------------------------------------------
  dagster:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - dagster_home:/app/.dagster
      - ./.deploy/docker/dagster/dagster.yaml:/app/.dagster/dagster.yaml:ro
      - abi_secrets:{{ SECRETS_DIR }}
{% if INCLUDE_CODING %}
      - coding_secrets:{{ CODING_SECRETS_DIR }}:ro
{% endif %}
    environment:
      - ENV=dokploy
      - PYTHONPATH=/app
      - DAGSTER_HOME=/app/.dagster
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - DAGSTER_S3_LOG_BUCKET=dagster-logs
      - MINIO_ENDPOINT_URL=http://minio:${MINIO_PORT}
      - MINIO_REGION_NAME=us-east-1
      - DAGSTER_PG_HOSTNAME=postgres
      - DAGSTER_PG_USERNAME=${POSTGRES_USER}
      - DAGSTER_PG_PASSWORD=${POSTGRES_PASSWORD}
      - DAGSTER_PG_DB=${POSTGRES_DB}
    command:
      - /bin/bash
      - -c
      - '{{ SECRETS_SETUP }} && exec uv run --no-dev dagster dev --host 0.0.0.0 --port 3001 -m naas_abi_core.apps.dagster.dagster'
{% if INCLUDE_CODING %}
    depends_on:
      coding-init:
        condition: service_completed_successfully
{% endif %}
    networks:
      - abi-network
{% endif %}

  # -----------------------------------------------------------------------------
  # MinIO - S3-compatible object storage
  # -----------------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    pull_policy: always
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - abi-network

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    pull_policy: always
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "
      until /usr/bin/mc alias set ${MINIO_ROOT_USER} http://minio:${MINIO_PORT} ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do sleep 1; done &&
      /usr/bin/mc mb -p ${MINIO_ROOT_USER}/dagster-logs || true &&
      /usr/bin/mc mb -p ${MINIO_ROOT_USER}/abi || true
      "
    networks:
      - abi-network

{% if NATS %}
  # -----------------------------------------------------------------------------
  # NATS - module fabric (JetStream: bus, RPC, jobs, discovery). Internal only.
  # -----------------------------------------------------------------------------
  nats:
    image: nats:2-alpine
    pull_policy: always
    restart: unless-stopped
    environment:
      - NATS_ABI_PASSWORD=${NATS_ABI_PASSWORD:?run abi deploy dokploy}
      - NATS_MODULE_PASSWORD=${NATS_MODULE_PASSWORD:?run abi deploy dokploy}
    command: ["nats-server", "-c", "/etc/nats/nats.conf", "-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data
      - ./.deploy/docker/nats/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 10
    networks:
      - abi-network
{% else %}
  # -----------------------------------------------------------------------------
  # RabbitMQ - message bus (AMQP). Internal only.
  # -----------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    pull_policy: always
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    networks:
      - abi-network
{% endif %}

  redis:
    image: redis:7-alpine
    pull_policy: always
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - abi-network

  qdrant:
    image: qdrant/qdrant:latest
    pull_policy: always
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - abi-network

{% if INCLUDE_CODING %}
  # ---------------------------------------------------------------------------
  # Coder - per-user browser IDE workspaces. Provisions workspaces as sibling
  # containers through the Docker socket, on the fixed-name abi network.
  # ---------------------------------------------------------------------------
  coder:
    image: ghcr.io/coder/coder:v2.34.1
    pull_policy: always
    restart: unless-stopped
    user: root
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CODER_PG_CONNECTION_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/coder?sslmode=disable"
      CODER_HTTP_ADDRESS: "0.0.0.0:7080"
      # Workspaces connect back through Traefik on the public host.
      CODER_ACCESS_URL: "https://coder.${PUBLIC_WEB_HOST}"
      CODER_WILDCARD_ACCESS_URL: "*.coder.${PUBLIC_WEB_HOST}"
      # Let the Nexus web origin frame Coder app surfaces.
      CODER_ADDITIONAL_CSP_POLICY: "frame-ancestors https://${PUBLIC_WEB_HOST}"
      CODER_TELEMETRY_ENABLE: "false"
      CODER_MAX_ADMIN_TOKEN_LIFETIME: "8760h"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - coder_data:/home/coder
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.${ABI_STACK_NAME}-coder.rule=Host(`coder.${PUBLIC_WEB_HOST}`)
      - traefik.http.routers.${ABI_STACK_NAME}-coder.entrypoints=websecure
      - traefik.http.routers.${ABI_STACK_NAME}-coder.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.${ABI_STACK_NAME}-coder.service=${ABI_STACK_NAME}-coder
      # Workspace apps on *.coder.<web host>.
      - traefik.http.routers.${ABI_STACK_NAME}-coder-apps.rule=HostRegexp(`^[a-z0-9-]+\.coder\.${PUBLIC_WEB_HOST}$$`)
      - traefik.http.routers.${ABI_STACK_NAME}-coder-apps.entrypoints=websecure
{% if CODER_WILDCARD_CERT %}
      # One wildcard certificate, from the DNS-challenge resolver named in
      # CODER_WILDCARD_CERT_RESOLVER (`--wildcard-cert-resolver`).
      - traefik.http.routers.${ABI_STACK_NAME}-coder-apps.tls.certresolver=${CODER_WILDCARD_CERT_RESOLVER:?rerun abi deploy dokploy --wildcard-cert-resolver}
      - traefik.http.routers.${ABI_STACK_NAME}-coder-apps.tls.domains[0].main=coder.${PUBLIC_WEB_HOST}
      - traefik.http.routers.${ABI_STACK_NAME}-coder-apps.tls.domains[0].sans=*.coder.${PUBLIC_WEB_HOST}
{% else %}
      # No DNS-challenge resolver yet: Let's Encrypt refuses a wildcard over
      # HTTP-01, so these hosts get Traefik's default certificate. Rerun with
      # `--wildcard-cert-resolver <name>` once one exists (see the guide).
      - traefik.http.routers.${ABI_STACK_NAME}-coder-apps.tls=true
{% endif %}
      - traefik.http.routers.${ABI_STACK_NAME}-coder-apps.service=${ABI_STACK_NAME}-coder
      - traefik.http.services.${ABI_STACK_NAME}-coder.loadbalancer.server.port=7080
    networks:
      abi-network:
        aliases:
          - ${ABI_STACK_NAME}-coder
      dokploy-network: {}

  # ---------------------------------------------------------------------------
  # Forgejo - git host + in-app code review backend, at git.<web host>.
  # ---------------------------------------------------------------------------
  forgejo:
    image: codeberg.org/forgejo/forgejo:9
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FORGEJO__database__DB_TYPE: "postgres"
      FORGEJO__database__HOST: "postgres:${POSTGRES_PORT}"
      FORGEJO__database__NAME: "forgejo"
      FORGEJO__database__USER: "${POSTGRES_USER}"
      FORGEJO__database__PASSWD: "${POSTGRES_PASSWORD}"
      FORGEJO__server__DOMAIN: "git.${PUBLIC_WEB_HOST}"
      FORGEJO__server__ROOT_URL: "https://git.${PUBLIC_WEB_HOST}/"
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
    volumes:
      - forgejo_data:/data
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.${ABI_STACK_NAME}-git.rule=Host(`git.${PUBLIC_WEB_HOST}`)
      - traefik.http.routers.${ABI_STACK_NAME}-git.entrypoints=websecure
      - traefik.http.routers.${ABI_STACK_NAME}-git.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.${ABI_STACK_NAME}-git.service=${ABI_STACK_NAME}-git
      - traefik.http.services.${ABI_STACK_NAME}-git.loadbalancer.server.port=3000
    networks:
      abi-network:
        aliases:
          - ${ABI_STACK_NAME}-forgejo
      dokploy-network: {}

  # Forgejo Actions runner (CI). Job containers join the fixed-name abi
  # network, so they reach Forgejo through its stack alias.
  act-runner:
    image: gitea/act_runner:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      coding-init:
        condition: service_completed_successfully
    environment:
      CONFIG_FILE: /config.yaml
      GITEA_INSTANCE_URL: "http://${ABI_STACK_NAME}-forgejo:3000"
      GITEA_RUNNER_REGISTRATION_TOKEN: "${FORGEJO_RUNNER_REGISTRATION_TOKEN}"
      GITEA_RUNNER_NAME: "${ABI_STACK_NAME}-runner"
    configs:
      - source: act_runner_config
        target: /config.yaml
    volumes:
      - act_runner_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - abi-network

  # ---------------------------------------------------------------------------
  # coding-init - one-shot bootstrap on every deploy (idempotent). Mints the
  # Coder and Forgejo admin tokens into the coding_secrets volume, which abi
  # mounts read-only, and registers the Actions runner. Exits 1 when a token is
  # missing, which fails the deploy: its logs say why, a redeploy retries.
  # ---------------------------------------------------------------------------
  coding-init:
    image: docker:cli
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      coder:
        condition: service_started
      forgejo:
        condition: service_started
    environment:
      CODING_SECRETS_FILE: {{ CODING_SECRETS_FILE }}
      # Fail the deploy when a token could not be minted, rather than start
      # abi without it.
      CODING_INIT_STRICT: "1"
      # Find this stack's containers, not another stack's on the same server.
      CODING_STACK_NETWORK: "${ABI_STACK_NAME}-abi-network"
      CODER_ADMIN_EMAIL: "${CODER_ADMIN_EMAIL:-admin@example.com}"
      CODER_ADMIN_USERNAME: "${CODER_ADMIN_USERNAME:-admin}"
      CODER_ADMIN_PASSWORD: "${CODER_ADMIN_PASSWORD}"
      FORGEJO_ADMIN_EMAIL: "${FORGEJO_ADMIN_EMAIL:-admin@example.com}"
      FORGEJO_ADMIN_USERNAME: "${FORGEJO_ADMIN_USERNAME:-forgejo-admin}"
      FORGEJO_ADMIN_PASSWORD: "${FORGEJO_ADMIN_PASSWORD}"
      FORGEJO_RUNNER_REGISTRATION_TOKEN: "${FORGEJO_RUNNER_REGISTRATION_TOKEN}"
      CODING_FORGEJO_ORG: "${CODING_FORGEJO_ORG:-abi}"
    entrypoint: ["/bin/sh", "/coding-bootstrap.sh"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.deploy/docker/bootstrap-coding.sh:/coding-bootstrap.sh:ro
      - ./.deploy:/host/.deploy:ro
      - coding_secrets:{{ CODING_SECRETS_DIR }}
    networks:
      - abi-network
{% endif %}

volumes:
  huggingface_cache:
  fuseki_data:
  postgres_data:
  qdrant_storage:
  minio_data:
  redis_data:
  abi_secrets:  # Secrets the engine writes at runtime (config.dokploy.yaml)
{% if NATS %}
  nats_data:
{% else %}
  rabbitmq_data:
  dagster_home:
{% endif %}
{% if INCLUDE_CODING %}
  coder_data:
  forgejo_data:
  act_runner_data:
  coding_secrets:  # Coder/Forgejo admin tokens minted by coding-init
{% endif %}
{% if INCLUDE_CODING %}

configs:
  act_runner_config:
    content: |
      log:
        level: info
      runner:
        capacity: 2
        timeout: 1h
        labels:
          - "ubuntu-latest:docker://node:20-bookworm"
          - "ubuntu-22.04:docker://node:20-bookworm"
          - "ubuntu-24.04:docker://node:22-bookworm"
      cache:
        enabled: true
      container:
        # Job containers join the stack network so they resolve `forgejo`.
        network: "${ABI_STACK_NAME}-abi-network"
        privileged: false
        valid_volumes: []
        force_pull: false
{% endif %}

networks:
  abi-network:
    # A fixed name, independent of the compose project Dokploy picks, so Coder
    # workspaces and CI jobs can join it. Unique per stack on a server.
    name: ${ABI_STACK_NAME:?set ABI_STACK_NAME}-abi-network
    driver: bridge
  dokploy-network:
    external: true
