# act_runner config for the Forgejo Actions CI runner (rendered by `abi deploy
# local --coding`). Job containers run on the project's `ci` network, where
# `checkout` reaches forgejo:3000 and nothing else of the stack.
log:
  level: info

runner:
  capacity: 2
  timeout: 1h
  # Map runs-on labels to multi-arch images (node:* carry node + npm + git + bash
  # — enough for checkout/npm, and they run natively on Apple Silicon).
  labels:
    - "ubuntu-latest:docker://node:20-bookworm"
    - "ubuntu-22.04:docker://node:20-bookworm"
    - "ubuntu-24.04:docker://node:22-bookworm"

cache:
  enabled: true

container:
  # Attach job containers to the `ci` network so they resolve `forgejo`.
  network: "{{ CODING_CI_DOCKER_NETWORK }}"
  # "-": job containers never get the Docker socket (an empty value mounts
  # the runner's into every job).
  docker_host: "-"
  privileged: false
  valid_volumes: []
  force_pull: false
