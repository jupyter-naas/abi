# nats-server configuration mounted by docker-compose (-c /etc/nats/nats.conf).
# The client port and JetStream stay on the command line; this file carries
# what the command line cannot: the monitoring address, max_payload and the
# broker's authorization.

# The monitoring port has no login and lists every connection, its account and
# its subscriptions. It listens on the `nats-monitor` alias, which only the
# compose's nats-monitor network resolves: the broker and the engine
# (nats.monitoring_url), not the modules and services on abi-network.
http: "nats-monitor:8222"

# Hard ceiling for ONE message: one RPC request or one reply. The 1 MB default
# refuses a 2 MB get_object or a whole-store triple_store.get. 8 MB is the
# largest value NATS recommends -- do not raise it further. Anything bigger
# must stream in chunks or return a storage reference instead.
max_payload: 8MB

# Two static users, and an auth callout for everyone else:
# - engine: the engine's processes (kernel services, API, Nexus, jobs), every
#   subject but $SYS. nats://engine:<NATS_ENGINE_PASSWORD>@nats:4222.
# - auth: the engine's auth callout responder, nothing else.
# - any other connection is asked of the engine: a module logs in as `sa` with
#   its service key as password and gets the subjects its approved permission
#   manifest allows. The engine signs those users with the account seed
#   NATS_AUTH_CALLOUT_SEED; NATS_AUTH_CALLOUT_ISSUER is its public key.
# `abi deploy local` generates all four in .env; the compose service refuses to
# start without them (nats-server takes an empty $VAR as an empty password).
authorization {
  users = [
    { user: engine, password: $NATS_ENGINE_PASSWORD, permissions: { publish: { deny: ["$SYS.>"] }, subscribe: { deny: ["$SYS.>"] } } }
    { user: auth, password: $NATS_AUTH_PASSWORD, permissions: { subscribe: "$SYS.REQ.USER.AUTH", allow_responses: true } }
  ]
  auth_callout {
    issuer: $NATS_AUTH_CALLOUT_ISSUER
    auth_users: [ engine, auth ]
  }
}
