# nats-server configuration mounted by docker-compose (-c /etc/nats/nats.conf).
# Ports, bind address and JetStream stay on the command line; this file carries
# what the command line cannot: max_payload and the broker's users.

# Hard ceiling for ONE message: one RPC request or one reply. The 1 MB default
# refuses a 2 MB get_object or a whole-store triple_store.get. 8 MB is the
# largest value NATS recommends -- do not raise it further. Anything bigger
# must stream in chunks or return a storage reference instead.
max_payload: 8MB

# Every client logs in. `abi deploy local` generates both passwords in .env and
# the compose service refuses to start without them: nats-server would take an
# empty $VAR as an empty password. A client passes its password in the URL:
# nats://abi:<NATS_ABI_PASSWORD>@nats:4222.
# - abi: the engine's process (kernel services, API, Nexus, jobs).
# - module: SDK modules joining the engine.
# Both users have every right for now. The passwords keep out whatever else
# reaches the broker (other containers on the Docker network, such as coding
# workspaces and CI jobs), not one module from another.
authorization {
  users = [
    { user: abi, password: $NATS_ABI_PASSWORD }
    { user: module, password: $NATS_MODULE_PASSWORD }
  ]
}
