# =============================================================================
# ABI (Agentic Brain Infrastructure) Docker Compose Configuration
# =============================================================================
# This file defines a complete AI agent ecosystem with:
# - Multi-model AI capabilities (chat, embeddings, reasoning)
# - Knowledge graph storage (Apache Jena Fuseki + TDB2)
# - Agent memory persistence (PostgreSQL)
{% if NATS %}
# - NATS + JetStream: kernel services, bus, module jobs and discovery. Modules
#   created with `abi new module` run in their own containers, declared in
#   docker-compose.override.yml (never touched by `abi deploy local --regenerate`).
{% else %}
# - Workflow orchestration (Dagster)
{% endif %}
# =============================================================================

# models:
#   gemma3:
#     model: ai/gemma3
#     context_size: 8192
#     runtime_flags:
#       - --memory=4g
#       - --cpus=2
#   embeddinggemma:
#     model: ai/embeddinggemma
#     context_size: 2048
#     runtime_flags:
#       - --memory=2g
#       - --cpus=1
#   qwen3:
#     model: ai/qwen3
#     context_size: 32768
#     runtime_flags:
#       - --memory=12g
#       - --cpus=4
 
x-abi-template: &abi_template
  build:
    context: .
    dockerfile: ./.deploy/docker/images/Dockerfile
  restart: unless-stopped
  # Every port but Caddy's is bound to this machine: the API and Nexus reach
  # the network through Caddy (TLS), the other services stay on abi-network.
  ports:
    - 127.0.0.1:9879:9879  # REST API endpoint - http://localhost:9879
    - 127.0.0.1:8501:8501  # Streamlit web interface - http://localhost:8501
  volumes:
    # Development volumes for hot-reload
    - .:/app
    # - ./scripts:/app/scripts
    # - ./uv.lock:/app/uv.lock
    # - ./config.yaml:/app/config.yaml
    # - ./pyproject.toml:/app/pyproject.toml
    # - ./Makefile:/app/Makefile
    # - ./storage:/app/storage  # Local file storage
    # - ./src:/app/src          # Source code
    # - ./libs:/app/libs        # Libraries
    # - ./README.md:/app/README.md
    # - ./.env:/app/.env
    # Cached volumes for performance
    - venv_cache:/app/.venv       # Python virtual environment cache
    - huggingface_cache:/root/.cache/huggingface  # Docling / HF model weights
  # Models come from OpenRouter by default, so nothing below is needed out of
  # the box. It is pre-wired for the opt-in local path: if you enable
  # `naas_abi_marketplace.ai.ollama` in config.local.yaml, Ollama runs on the
  # *host*, not in the stack. `host.docker.internal` is built in on Docker
  # Desktop (macOS/Windows) but not on Linux Docker, where host-gateway
  # supplies it.
  #
  # LINUX ONLY: host-gateway makes the host *resolvable*, it does not change
  # what Ollama listens on. A stock Linux install binds 127.0.0.1:11434, so
  # this container will get "connection refused" until the host is bound
  # somewhere the bridge can reach:
  #   sudo systemctl edit ollama
  #     [Service]
  #     Environment="OLLAMA_HOST=0.0.0.0:11434"
  #   sudo systemctl restart ollama
  # Do that only on a trusted network, or bind the bridge address instead
  # (OLLAMA_HOST=172.17.0.1:11434) and firewall the port. See the project
  # README. Docker Desktop on macOS/Windows needs none of this.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    - ENV=local
    - LOG_LEVEL=DEBUG
    - PYTHONPATH=/app
    - POSTGRES_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
    - VECTOR_STORE_ADAPTER=qdrant
    - QDRANT_HOST=qdrant
    - QDRANT_PORT=${QDRANT_PORT}
    # Override to point at a remote/dedicated Ollama server instead of the host.
    - ABI_OLLAMA_BASE_URL=${ABI_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
{% if INCLUDE_CODING %}
    # Coding workspaces: the network Coder attaches workspaces to (the
    # `coding` network: Forgejo, coderd and this API, no data service), and
    # the public git base for clone URLs.
    - CODING_WORKSPACE_DOCKER_NETWORK=${CODING_WORKSPACE_DOCKER_NETWORK}
    - CODING_GIT_PUBLIC_BASE=https://git.${PUBLIC_WEB_HOST:-localhost}
{% endif %}
  # env_file:
  #   - .env  # Load environment variables (API keys, AI_MODE, etc.)
  depends_on:
    postgres:
      condition: service_healthy
{% if NATS %}
    nats:
      condition: service_healthy
{% else %}
    rabbitmq:
      condition: service_healthy
{% endif %}
    qdrant:
      condition: service_healthy
    redis:
      condition: service_healthy
    fuseki:
      condition: service_healthy
    minio:
      condition: service_healthy
{% if INCLUDE_CODING %}
    # Wait for the coding bootstrap so abi reads the minted admin tokens from
    # .env at startup (its dotenv secret adapter reads the file, not compose env).
    coding-init:
      condition: service_completed_successfully
{% endif %}
  healthcheck:
    test: ["CMD-SHELL", "for i in 1 2 3; do curl -fsS http://localhost:9879/ >/dev/null || exit 1; sleep 2; done"]
    interval: 10s
    timeout: 15s
    # A first boot loads every module and ontology: about three minutes. Failed
    # probes inside start_period do not count, and `docker compose up` fails
    # as soon as the engine is reported unhealthy.
    start_period: 5m
    retries: 10
  networks:
    - abi-network
    # The broker's monitoring port (nats.monitoring_url): the engine only.
    - nats-monitor
{% if INCLUDE_CODING %}
    # Workspaces reach the API here, and the API their exec sidecars.
    - coding
{% endif %}

services:
  nexus-web:
    image: ${NEXUS_WEB_IMAGE}:${NEXUS_WEB_TAG}
    pull_policy: always
    restart: unless-stopped
    ports:
      - 127.0.0.1:${NEXUS_WEB_PORT}:3000
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_NEXUS_ENV=local
      - NEXUS_API_URL=${NEXUS_API_URL}
      - NEXT_PUBLIC_API_URL=${NEXUS_API_URL}
      - NEXUS_INTERNAL_API_URL=http://abi:9879
      - NEXT_PUBLIC_SITE_URL=https://${PUBLIC_WEB_HOST}
      - NEXT_PUBLIC_WS_PATH=/ws/socket.io
      - DEFAULT_WORKSPACE=${NEXUS_DEFAULT_WORKSPACE:-primary}
    networks:
      - abi-network

  caddy:
    image: caddy:2-alpine
    pull_policy: always
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    environment:
      - PUBLIC_WEB_HOST=${PUBLIC_WEB_HOST:-localhost}
      - PUBLIC_API_HOST=${PUBLIC_API_HOST:-api.localhost}
{% if INCLUDE_HEADSCALE %}
      - HEADSCALE_SERVER_URL=${HEADSCALE_SERVER_URL:-headscale.localhost}
{% endif %}
    volumes:
      - ./.deploy/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nexus-web
      - abi
{% if INCLUDE_HEADSCALE %}
      - headscale
{% endif %}
    networks:
      - abi-network

  # -----------------------------------------------------------------------------
  # ABI Main Service - AI Agent Coordinator
  # -----------------------------------------------------------------------------
  # The core ABI application that routes between specialized AI agents
  # and coordinates multi-model conversations
  abi:
    <<: *abi_template
    command: ["uv", "run", "--no-dev", "python", "-m", "naas_abi_core.apps.api.api"]  # Start ABI application
    # models:
    #   - gemma3        # Primary conversational AI model
    #   - embeddinggemma # Text embedding model for semantic search
    #   - qwen3         # Advanced reasoning model
  
  mcp-server:
    build:
      context: .
      dockerfile: ./.deploy/docker/images/Dockerfile
    restart: unless-stopped
    depends_on:
      abi:
        condition: service_healthy
    command:
      ["uv", "run", "--no-dev", "python", "-m", "naas_abi_core.apps.mcp.mcp_server"]
    # The project and the venv the abi service synced (it is healthy first).
    volumes:
      - .:/app
      - venv_cache:/app/.venv
    environment:
      - ABI_API_BASE=http://abi:9879
      - ABI_API_KEY=${ABI_API_KEY}
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
    ports:
      # The MCP server checks no credential and calls agents with ABI_API_KEY:
      # from this machine only.
      - 127.0.0.1:8000:8000
    networks:
      - abi-network

  # -----------------------------------------------------------------------------
  # PostgreSQL Database - Agent Memory & Conversation Storage
  # -----------------------------------------------------------------------------
  # Stores agent conversation history, checkpoints, and persistent memory
  # Used by LangGraph for agent state management and memory retrieval
  postgres:
    image: postgres:17-alpine  # Latest stable PostgreSQL
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB} # Database for agent conversations and memory
    ports:
      - 127.0.0.1:${POSTGRES_PORT}:${POSTGRES_PORT}  # PostgreSQL database - postgresql://abi_user:abi_password@localhost:${POSTGRES_PORT}/abi_memory
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persistent data storage
      - ./.deploy/docker/postgres/initdb:/docker-entrypoint-initdb.d:ro  # Bootstrap additional databases
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - abi-network

  # -----------------------------------------------------------------------------
  # Apache Jena Fuseki (TDB2) - Knowledge Graph Database (RDF/SPARQL)
  # -----------------------------------------------------------------------------
  # Stores structured knowledge as RDF triples for semantic reasoning
  # TDB2 provides transactional storage with SPARQL query/update endpoints
  fuseki:
    # Staying on stain/jena-fuseki (the older community image) for now — this is
    # only about making the *current* store reliable. Apache does NOT publish a
    # prebuilt Fuseki image on Docker Hub (the official path is the build-your-own
    # jena-fuseki-docker kit), so moving off this is a real migration (build an
    # image + back up + dump-and-reload the TDB2 data), tracked separately.
    # `pull_policy: always` dropped on purpose: a boot now uses the locally cached
    # image instead of requiring a registry pull every start (one less thing that
    # can fail a restart). Re-add it if you'd rather always re-pull.
    image: stain/jena-fuseki:latest
    restart: unless-stopped
    ports:
      - 127.0.0.1:3030:3030
    volumes:
      - fuseki_data:/fuseki
    # Cap Docker memory so the JVM can't balloon and get OOM-killed mid-write —
    # an unclean kill is what leaves TDB2's node table/journal corrupt. Keep
    # mem_limit comfortably above JVM_ARGS -Xmx: TDB2 memory-maps its files
    # off-heap, so it needs headroom on top of the Java heap. Tune to host/data.
    mem_limit: 4g
    environment:
      - ADMIN_PASSWORD=${FUSEKI_ADMIN_PASSWORD:-}
      # The engine's own user (`abi`): the dataset's endpoints only, not the
      # admin API. Optional: without it the engine uses `admin`.
      - ENGINE_PASSWORD=${FUSEKI_ENGINE_PASSWORD:-}
      - JVM_ARGS=-Xmx2g
    # The image's entrypoint keeps the first shiro.ini it wrote, which lets
    # anyone read the dataset. This command writes the access rules and the
    # dataset on every start, then runs the server.
    entrypoint: ["/sbin/tini", "--"]
    command:
      - bash
      - -c
      - |
        set -e
        [ -n "$$ADMIN_PASSWORD" ] || { echo "FUSEKI_ADMIN_PASSWORD is empty: run abi deploy" >&2; exit 1; }
        mkdir -p /fuseki/configuration /fuseki/databases/ds
        # Every request needs a password, except the ping: the admin API and
        # the web UI the `admin` role, the dataset the `engine` role.
        umask 077
        {
          printf '[main]\n'
          printf 'plainMatcher = org.apache.shiro.authc.credential.SimpleCredentialsMatcher\n'
          printf 'iniRealm.credentialsMatcher = $$plainMatcher\n'
          printf '[users]\n'
          printf 'admin = %s, admin, engine\n' "$$ADMIN_PASSWORD"
          if [ -n "$$ENGINE_PASSWORD" ]; then printf 'abi = %s, engine\n' "$$ENGINE_PASSWORD"; fi
          printf '[roles]\nadmin = *\nengine = *\n'
          printf '[urls]\n'
          printf '/$$/ping = anon\n'
          printf '/$$/** = authcBasic, roles[admin]\n'
          printf '/ds/** = authcBasic, roles[engine]\n'
          printf '/** = authcBasic, roles[admin]\n'
        } > /fuseki/shiro.ini
        # SPARQL query and update only (no graph store endpoints), and no
        # SERVICE: the store never calls another server.
        cat > /fuseki/configuration/ds.ttl <<'TTL'
        @prefix :        <#> .
        @prefix fuseki:  <http://jena.apache.org/fuseki#> .
        @prefix rdf:     <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .
        @prefix ja:      <http://jena.hpl.hp.com/2005/11/Assembler#> .
        @prefix tdb2:    <http://jena.apache.org/2016/tdb#> .

        :service rdf:type fuseki:Service ;
            fuseki:name "ds" ;
            fuseki:endpoint [ fuseki:operation fuseki:query ;
                              fuseki:name "sparql" ;
                              ja:context [ ja:cxtName "tdb:unionDefaultGraph" ;
                                           ja:cxtValue true ] ;
                              ja:context [ ja:cxtName "arq:httpServiceAllowed" ;
                                           ja:cxtValue false ] ] ;
            fuseki:endpoint [ fuseki:operation fuseki:query ;
                              fuseki:name "query" ;
                              ja:context [ ja:cxtName "tdb:unionDefaultGraph" ;
                                           ja:cxtValue true ] ;
                              ja:context [ ja:cxtName "arq:httpServiceAllowed" ;
                                           ja:cxtValue false ] ] ;
            fuseki:endpoint [ fuseki:operation fuseki:update ;
                              fuseki:name "update" ] ;
            fuseki:dataset :dataset .

        :dataset rdf:type tdb2:DatasetTDB2 ;
            ja:context [ ja:cxtName "arq:httpServiceAllowed" ;
                         ja:cxtValue false ] ;
            tdb2:location "/fuseki/databases/ds" .
        TTL
        exec /jena-fuseki/fuseki-server
    healthcheck:
      # Probe the DATASET, not just the web root. `curl /` returns 200 even when
      # the `ds` dataset failed to attach or is corrupt, which lets dependents
      # start against a dead store and then 500 on the first query. `ASK { ?s ?p
      # ?o }` short-circuits at the first triple (cheap) but opens TDB2 storage,
      # so a broken dataset correctly marks the container unhealthy. Authenticated
      # because the server runs with ADMIN_PASSWORD; `$$` is a literal `$` in the
      # container shell (Compose would otherwise treat `$ADMIN_PASSWORD` as a
      # host-side variable).
      test: ["CMD-SHELL", "curl -fsS -u admin:$$ADMIN_PASSWORD 'http://localhost:3030/ds/query?query=ASK%20%7B%20%3Fs%20%3Fp%20%3Fo%20%7D' >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      # Grace window for TDB2 to attach/recover before probes count; the
      # interval×retries budget below still covers slower recoveries.
      start_period: 20s
    networks:
      - abi-network

  # -----------------------------------------------------------------------------
  # Fuseki Compaction - Periodic TDB2 database compaction
  # -----------------------------------------------------------------------------
  # TDB2 retains previous versions of the data after updates/deletes, so the
  # on-disk database keeps growing. This lightweight sidecar periodically calls
  # Fuseki's admin compact endpoint (deleteOld=true) to reclaim that space and
  # keep query latency stable. The cadence is controlled by
  # FUSEKI_COMPACT_INTERVAL_SECONDS (default: 86400s = 1 day).
  # NOTE: "$$" is how docker-compose escapes a literal "$" so the shell (not
  # compose) expands the variable and the "/$/compact" admin path is preserved.
  fuseki-compact:
    image: curlimages/curl:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - fuseki
    environment:
      - ADMIN_PASSWORD=${FUSEKI_ADMIN_PASSWORD}
      - COMPACT_INTERVAL_SECONDS=${FUSEKI_COMPACT_INTERVAL_SECONDS}
    entrypoint: /bin/sh
    command: >-
      -c 'while true; do
            sleep "$$COMPACT_INTERVAL_SECONDS";
            echo "[fuseki-compact] triggering TDB2 compaction (deleteOld=true)...";
            curl -fsS -u "admin:$$ADMIN_PASSWORD" -X POST "http://fuseki:3030/$$/compact/ds?deleteOld=true" ||
              echo "[fuseki-compact] compaction request failed";
          done'
    networks:
      - abi-network

{% if not NATS %}
  # -----------------------------------------------------------------------------
  # Dagster - Workflow Orchestration & Data Pipeline Management
  # -----------------------------------------------------------------------------
  # Manages data pipelines, asset materialization, and workflow scheduling
  # Provides web UI for monitoring and managing data operations
  dagster:
    build:
      context: .
      dockerfile: ./.deploy/docker/images/Dockerfile
    restart: unless-stopped
    ports:
      - 127.0.0.1:3001:3001  # Dagster web UI - http://localhost:3001
    volumes:
      # - ./scripts:/app/scripts
      # - ./uv.lock:/app/uv.lock
      # - ./config.local.yaml:/app/config.yaml # We mount the config.local.yaml as it's configured to run from within the containers network.
      # - ./pyproject.toml:/app/pyproject.toml
      # - ./src:/app/src
      # - ./README.md:/app/README.md
      # - ./storage:/app/storage
      # - .env:/app/.env
      - .:/app
      - venv_cache:/app/.venv
      - dagster_home:/app/.dagster  # Dagster metadata and run history
      - ./.deploy/docker/dagster/dagster.yaml:/app/.dagster/dagster.yaml:ro
    environment:
      - ENV=local
      - PYTHONPATH=/app
      - DAGSTER_HOME=/app/.dagster
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - DAGSTER_S3_LOG_BUCKET=dagster-logs
      - MINIO_ENDPOINT_URL=http://minio:${MINIO_PORT}
      - MINIO_REGION_NAME=us-east-1
      - DAGSTER_PG_HOSTNAME=postgres
      - DAGSTER_PG_USERNAME=${POSTGRES_USER}
      - DAGSTER_PG_PASSWORD=${POSTGRES_PASSWORD}
      - DAGSTER_PG_DB=${POSTGRES_DB}
    command:
      - /bin/bash
      - -c
      - 'uv run dagster dev --host 0.0.0.0 --port 3001 -m naas_abi_core.apps.dagster.dagster'
{% if INCLUDE_CODING %}
    # Dagster loads the engine config too, so wait for coding-init to mint the
    # admin tokens into .env before it resolves the secret placeholders.
    depends_on:
      coding-init:
        condition: service_completed_successfully
{% endif %}
    networks:
      - abi-network
{% endif %}

  # -----------------------------------------------------------------------------
  # MinIO - S3-compatible Object Storage for Dagster Compute Logs
  # -----------------------------------------------------------------------------
  minio:
    # MinIO stopped publishing public images (quay.io/minio, minio/* on Docker Hub).
    # pgsty/minio is a community fork built from MinIO source, drop-in compatible.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    pull_policy: always
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - 127.0.0.1:${MINIO_PORT}:${MINIO_PORT}  # S3 API endpoint - http://localhost:${MINIO_PORT}
      - 127.0.0.1:9001:9001  # MinIO console - http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - abi-network

  # mc container to initialize the bucket on startup
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    pull_policy: always
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "
      until /usr/bin/mc alias set ${MINIO_ROOT_USER} http://minio:${MINIO_PORT} ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do sleep 1; done &&
      /usr/bin/mc mb -p ${MINIO_ROOT_USER}/dagster-logs || true &&
      /usr/bin/mc mb -p ${MINIO_ROOT_USER}/abi || true
      "
    networks:
      - abi-network

  # -----------------------------------------------------------------------------
  # RabbitMQ - Message Bus (AMQP)
  # -----------------------------------------------------------------------------
{% if NATS %}
  # Not used in NATS mode (the bus is JetStream). Kept for modules that talk
  # AMQP themselves: docker compose --profile rabbitmq up -d rabbitmq
{% endif %}
  rabbitmq:
{% if NATS %}
    profiles: ["rabbitmq"]
{% endif %}
    image: rabbitmq:3-management
    pull_policy: always
    restart: unless-stopped
    ports:
      - 127.0.0.1:5672:5672   # AMQP
      - 127.0.0.1:15672:15672 # Management UI - http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    networks:
      - abi-network

  # -----------------------------------------------------------------------------
  # NATS - Distributed module fabric (JetStream: bus, RPC, jobs, discovery)
  # -----------------------------------------------------------------------------
{% if NATS %}
  # The engine (abi) reaches every kernel service through it, and modules
  # register here. Its monitoring port (8222, no login) answers on the
  # nats-monitor network only, which the engine (abi) joins and nothing else:
  #   docker compose exec nats wget -qO- http://nats-monitor:8222/connz
  nats:
{% else %}
  # Opt-in: this project runs without NATS (no `nats:` block in its config).
  # To move it over: https://docs.naas.ai/user-guide/upgrade/migrate-to-3
  nats:
    profiles: ["nats"]
{% endif %}
    image: nats:2.14.7-alpine
    pull_policy: always
    restart: unless-stopped
    environment:
      # The broker's static users and its auth callout's trusted key (nats.conf).
      # `abi deploy local` generates them in .env.
      - NATS_ENGINE_PASSWORD=${NATS_ENGINE_PASSWORD:-}
      - NATS_AUTH_PASSWORD=${NATS_AUTH_PASSWORD:-}
      - NATS_AUTH_CALLOUT_ISSUER=${NATS_AUTH_CALLOUT_ISSUER:-}
    # nats-server takes an empty password as is, which would let anyone log in
    # as that user: refuse to start without all three.
    command:
      - sh
      - -c
      - |
        for key in NATS_ENGINE_PASSWORD NATS_AUTH_PASSWORD NATS_AUTH_CALLOUT_ISSUER; do
          [ -n "$$(printenv $$key)" ] || { echo "$$key is empty: run abi deploy local" >&2; exit 1; }
        done
        exec nats-server -c /etc/nats/nats.conf -js -sd /data
    ports:
      - 127.0.0.1:4222:4222 # client connections, from this machine only
    volumes:
      - nats_data:/data
      - ./.deploy/docker/nats/nats.conf:/etc/nats/nats.conf:ro # max_payload (no CLI flag)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://nats-monitor:8222/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 10
    networks:
      abi-network: {}
      # nats.conf binds the monitoring port to this alias.
      nats-monitor:
        aliases: [nats-monitor]

{% if NATS %}
  # -----------------------------------------------------------------------------
  # idp - the built-in identity provider (naas-abi-idp)
  # -----------------------------------------------------------------------------
  # An SDK module in its own container, logged in to the broker with its own
  # service key (the account module/<project>/idp). Nexus serves it at /idp on
  # the API host and the engine reads it through NATS; its users, keys and
  # codes are in its own Document Service namespace and secrets, which not even
  # the `abi` service can read. It waits for its key: once the stack is up,
  #   abi iam service-account create module/{{ DISCOVERY_PROJECT }}/idp --key
  # put the key in .env as IDP_SERVICE_KEY, approve its permissions
  #   abi iam module approve module/{{ DISCOVERY_PROJECT }}/idp
  # and start it: docker compose up -d idp
  idp:
    build:
      context: ./.abi/libs/naas-abi-idp
      additional_contexts:
        abi_proto: ./.abi/libs/naas-abi-proto
        abi_sdk: ./.abi/libs/naas-abi-sdk
    pull_policy: build
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        [ -n "$$ABI_SERVICE_KEY" ] || { echo "IDP_SERVICE_KEY is empty: create the key of module/{{ DISCOVERY_PROJECT }}/idp (see docker-compose.yml)" >&2; sleep 30; exit 1; }
        exec python -m naas_abi_idp
    environment:
      # No login in the URL: the provider logs in with its own key.
      - ABI_NATS_URL=nats://nats:4222
      - ABI_SERVICE_KEY=${IDP_SERVICE_KEY:-}
      - ABI_DISCOVERY_PROJECT={{ DISCOVERY_PROJECT }}
      - ABI_IDP_ISSUER=${NEXUS_API_URL}/idp
      - ABI_IDP_CLIENT_ID=abi
      - ABI_IDP_CLIENT_SECRET=${ABI_IDP_CLIENT_SECRET:?run abi deploy local}
      - ABI_IDP_REDIRECT_URIS=${NEXUS_API_URL}/api/auth/oidc/callback
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      abi:
        condition: service_healthy
    networks:
      - abi-network

{% endif %}  # -----------------------------------------------------------------------------
  # Redis - In-memory Cache / Message Broker
  # -----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    pull_policy: always
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # redis-cli of the healthcheck reads it.
      - REDISCLI_AUTH=${REDIS_PASSWORD:-}
    # No password, no server: the image's default lets in every client.
    command:
      - sh
      - -c
      - |
        [ -n "$$REDIS_PASSWORD" ] || { echo "REDIS_PASSWORD is empty: run abi deploy" >&2; exit 1; }
        exec docker-entrypoint.sh redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - abi-network

  # -----------------------------------------------------------------------------
  # Service Portal - Single-page navigation for all HTTP UIs
  # -----------------------------------------------------------------------------
  service-portal:
    image: nginx:alpine
    pull_policy: always
    restart: unless-stopped
    ports:
      - 127.0.0.1:8080:80  # Service portal - http://localhost:8080
    environment:
      - PUBLIC_WEB_HOST=${PUBLIC_WEB_HOST:-localhost}
      - PUBLIC_API_HOST=${PUBLIC_API_HOST:-api.localhost}
      - NGINX_ENVSUBST_TEMPLATE_DIR=/usr/share/nginx/templates
      - NGINX_ENVSUBST_TEMPLATE_SUFFIX=.template
      - NGINX_ENVSUBST_OUTPUT_DIR=/usr/share/nginx/html
    volumes:
      - ./.deploy/docker/service-portal:/usr/share/nginx/templates:ro
    networks:
      - abi-network

{% if INCLUDE_CODING %}
  # ---------------------------------------------------------------------------
  # Coder - per-user browser IDE workspaces (coding_environment service)
  # ---------------------------------------------------------------------------
  # Provisions workspaces as sibling Docker containers through coder-docker, a
  # Docker API limited to what that needs; it runs as its own user. It starts
  # once coder-owner made its owner.
  coder:
    image: ghcr.io/coder/coder:v2.34.1
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      coder-owner:
        condition: service_completed_successfully
      coder-docker:
        condition: service_started
    ports:
      - "127.0.0.1:7080:7080"
    environment:
      DOCKER_HOST: "tcp://coder-docker:2375"
      CODER_PG_CONNECTION_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/coder?sslmode=disable"
      CODER_HTTP_ADDRESS: "0.0.0.0:7080"
      # Agent connect-back URL. Workspaces reach coderd by its service name on
      # the stack network: its port is published on this machine only. Set
      # CODER_ACCESS_URL=https://coder.${PUBLIC_WEB_HOST} for a real domain.
      CODER_ACCESS_URL: "${CODER_ACCESS_URL:-http://coder:7080}"
      # Hostname-only (Coder rejects a scheme). The adapter strips the echoed
      # internal port so app URLs ride Caddy's TLS edge on 443.
      CODER_WILDCARD_ACCESS_URL: "*.coder.${PUBLIC_WEB_HOST:-localhost}"
      # Let the Nexus web origin frame Coder app surfaces (default CSP is 'self').
      CODER_ADDITIONAL_CSP_POLICY: "frame-ancestors https://${PUBLIC_WEB_HOST:-localhost}"
      CODER_TELEMETRY_ENABLE: "false"
      # Admin tokens are capped by max-admin-token-lifetime (default 168h/7d),
      # which expired the IDE page weekly; allow up to ~1y.
      CODER_MAX_ADMIN_TOKEN_LIFETIME: "8760h"
    volumes:
      - coder_data:/home/coder
    networks:
      - abi-network
      - coding
      - coder-docker

  # ---------------------------------------------------------------------------
  # coder-owner - one-shot, before Coder starts. Coder makes whoever calls
  # POST /api/v2/users/first its owner while it has no user: the first time,
  # this runs coderd on its own loopback (the migrations run there, with no
  # provisioner, so it never takes a workspace build), creates the owner from
  # CODER_ADMIN_*, and leaves a marker in Coder's volume; later runs only check
  # the marker. It also hands Coder's volume to the user Coder runs as (Coder
  # ran as root before). Coder starts only once it succeeded.
  # ---------------------------------------------------------------------------
  coder-owner:
    image: ghcr.io/coder/coder:v2.34.1
    pull_policy: always
    restart: "no"
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CODER_PG_CONNECTION_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/coder?sslmode=disable"
      CODER_TELEMETRY_ENABLE: "false"
      CODER_PROVISIONER_DAEMONS: "0"
      CODER_ADMIN_EMAIL: "${CODER_ADMIN_EMAIL:-}"
      CODER_ADMIN_USERNAME: "${CODER_ADMIN_USERNAME:-admin}"
      CODER_ADMIN_PASSWORD: "${CODER_ADMIN_PASSWORD:-}"
    volumes:
      - coder_data:/home/coder
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        chown -R 1000:1000 /home/coder
        if [ -f /home/coder/.abi-coder-owner ]; then echo "Coder owner exists"; exit 0; fi
        [ -n "$$CODER_ADMIN_EMAIL" ] && [ -n "$$CODER_ADMIN_PASSWORD" ] || { echo "CODER_ADMIN_EMAIL or CODER_ADMIN_PASSWORD is empty: run abi deploy" >&2; exit 1; }
        /opt/coder server --http-address 127.0.0.1:7080 --access-url http://127.0.0.1:7080 >/tmp/coderd.log 2>&1 &
        pid=$$!
        i=0
        until curl -fsS http://127.0.0.1:7080/api/v2/buildinfo >/dev/null 2>&1; do
          i=$$((i + 1))
          if [ "$$i" -ge 180 ] || ! kill -0 "$$pid" 2>/dev/null; then tail -n 20 /tmp/coderd.log >&2; exit 1; fi
          sleep 1
        done
        if curl -fsS http://127.0.0.1:7080/api/v2/users/first >/dev/null 2>&1; then
          echo "Coder owner exists"
        else
          printf '{"email":"%s","username":"%s","password":"%s","name":"Admin","trial":false}' \
            "$$CODER_ADMIN_EMAIL" "$$CODER_ADMIN_USERNAME" "$$CODER_ADMIN_PASSWORD" \
            | curl -fsS -X POST http://127.0.0.1:7080/api/v2/users/first -H 'Content-Type: application/json' -d @- >/dev/null
          echo "Coder owner created"
        fi
        kill "$$pid"
        wait "$$pid" 2>/dev/null || true
        touch /home/coder/.abi-coder-owner
        chown 1000:1000 /home/coder/.abi-coder-owner
    networks:
      - abi-network

  # ---------------------------------------------------------------------------
  # coder-docker - the Docker API Coder provisions workspaces with: containers,
  # images, networks and volumes, nothing else (no exec, no swarm, no secrets).
  # Coder runs as its own user and never holds the socket.
  # ---------------------------------------------------------------------------
  coder-docker:
    image: tecnativa/docker-socket-proxy:0.3.0@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      VOLUMES: "1"
      INFO: "1"
      VERSION: "1"
      POST: "1"
      EXEC: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - coder-docker

  # ---------------------------------------------------------------------------
  # Forgejo - git host + in-app code review backend (source_control service)
  # ---------------------------------------------------------------------------
  # Authoritative git for the monorepo (branch per workspace). The Nexus review
  # UI is built on its REST API (users don't browse Forgejo directly); proxied
  # internally at git.${PUBLIC_WEB_HOST}. Uses the shared Postgres `forgejo` DB
  # (created by initdb/004-create-forgejo-db.sql).
  forgejo:
    image: codeberg.org/forgejo/forgejo:9
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FORGEJO__database__DB_TYPE: "postgres"
      FORGEJO__database__HOST: "postgres:${POSTGRES_PORT}"
      FORGEJO__database__NAME: "forgejo"
      FORGEJO__database__USER: "${POSTGRES_USER}"
      FORGEJO__database__PASSWD: "${POSTGRES_PASSWORD}"
      FORGEJO__server__DOMAIN: "git.${PUBLIC_WEB_HOST:-localhost}"
      FORGEJO__server__ROOT_URL: "https://git.${PUBLIC_WEB_HOST:-localhost}/"
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
    volumes:
      - forgejo_data:/data
    networks:
      - abi-network
      - coding
      - ci

  # ---------------------------------------------------------------------------
  # Forgejo Actions runner (CI). coding-init registers it server-side with the
  # shared FORGEJO_RUNNER_REGISTRATION_TOKEN (40-hex), so the runner just uses
  # the same value. Mounts docker.sock to spawn job containers, which run on
  # the `ci` network (Forgejo only) without the socket (act-runner-config.yaml).
  act-runner:
    image: gitea/act_runner:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      coding-init:
        condition: service_completed_successfully
    environment:
      CONFIG_FILE: /config.yaml
      GITEA_INSTANCE_URL: "http://forgejo:3000"
      GITEA_RUNNER_REGISTRATION_TOKEN: "${FORGEJO_RUNNER_REGISTRATION_TOKEN}"
      GITEA_RUNNER_NAME: "nexus-runner"
    volumes:
      - act_runner_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.deploy/docker/act-runner-config.yaml:/config.yaml:ro
    networks:
      - ci

  # ---------------------------------------------------------------------------
  # coding-init - one-shot bootstrap, runs on every `up` (idempotent). Waits for
  # Coder + Forgejo, mints the two admin tokens into .env (abi reads them from
  # the file at startup), and registers the Actions runner with the shared
  # secret. Uses the docker socket to run Forgejo's CLI as the `git` user inside
  # the forgejo container, and curls the Coder API. abi + act-runner wait for it.
  coding-init:
    image: docker:cli
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      coder:
        condition: service_started
      forgejo:
        condition: service_started
    environment:
      CODER_ADMIN_EMAIL: "${CODER_ADMIN_EMAIL:-admin@example.com}"
      CODER_ADMIN_USERNAME: "${CODER_ADMIN_USERNAME:-admin}"
      CODER_ADMIN_PASSWORD: "${CODER_ADMIN_PASSWORD}"
      FORGEJO_ADMIN_EMAIL: "${FORGEJO_ADMIN_EMAIL:-admin@example.com}"
      FORGEJO_ADMIN_USERNAME: "${FORGEJO_ADMIN_USERNAME:-forgejo-admin}"
      FORGEJO_ADMIN_PASSWORD: "${FORGEJO_ADMIN_PASSWORD}"
      FORGEJO_RUNNER_REGISTRATION_TOKEN: "${FORGEJO_RUNNER_REGISTRATION_TOKEN}"
      CODING_FORGEJO_ORG: "${CODING_FORGEJO_ORG:-abi}"
    entrypoint: ["/bin/sh", "/coding-bootstrap.sh"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.deploy/docker/bootstrap-coding.sh:/coding-bootstrap.sh:ro
      - .:/host
    networks:
      - abi-network
{% endif %}

{% if INCLUDE_HEADSCALE %}
  # -----------------------------------------------------------------------------
  # Headscale - Self-hosted Tailscale control server
  # -----------------------------------------------------------------------------
  headscale:
    image: docker.io/headscale/headscale:stable
    pull_policy: always
    restart: unless-stopped
    command: ["serve"]
    ports:
      - 127.0.0.1:${HEADSCALE_SERVER_PORT}:8080
      - 127.0.0.1:${HEADSCALE_METRICS_PORT}:9090
      - 127.0.0.1:${HEADSCALE_GRPC_PORT}:50443
    volumes:
      - ./.deploy/docker/headscale/config.yaml:/etc/headscale/config.yaml:ro
      - ./.deploy/docker/headscale/extra-records.json:/var/lib/headscale/extra-records.json:ro
      - headscale_data:/var/lib/headscale
      - headscale_run:/var/run/headscale
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - abi-network
{% endif %}

# =============================================================================
# PERSISTENT VOLUMES
# =============================================================================
# Named volumes for persistent data storage across container restarts

  qdrant:
    image: qdrant/qdrant:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - 127.0.0.1:6333:6333
      - 127.0.0.1:6334:6334
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      # Every request carries this key (the engine's `api_key`).
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
    command:
      - bash
      - -c
      - |
        [ -n "$$QDRANT__SERVICE__API_KEY" ] || { echo "QDRANT_API_KEY is empty: run abi deploy" >&2; exit 1; }
        exec ./entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - abi-network

volumes:
  venv_cache:     # Python virtual environment cache for faster startup
  huggingface_cache: # Hugging Face model cache (docling layout / table models)
  fuseki_data:    # RDF triple store data (knowledge graph persistence)
  postgres_data:  # PostgreSQL database files (agent memory persistence)
{% if not NATS %}
  dagster_home:   # Dagster metadata, run history, and configuration
{% endif %}
  qdrant_storage: # Qdrant vector store data
{% if INCLUDE_CODING %}
  coder_data:      # Coder control-plane state (home dir)
  forgejo_data:    # Forgejo git repositories + state
  act_runner_data: # Forgejo Actions runner state
{% endif %}
{% if INCLUDE_HEADSCALE %}
  headscale_data: # Headscale state and sqlite database
  headscale_run:  # Headscale unix socket runtime data
{% endif %}
  minio_data:     # MinIO object storage data
  rabbitmq_data:  # RabbitMQ message bus data
  nats_data:      # NATS JetStream persistence (streams, KV, module registry)
  redis_data:     # Redis persistence data
  caddy_data:     # Caddy certificates and ACME data
  caddy_config:   # Caddy runtime configuration

# =============================================================================
# NETWORK CONFIGURATION
# =============================================================================
# Custom bridge network for service-to-service communication

networks:
  abi-network:
    driver: bridge  # Default Docker bridge network for internal communication
{% if INCLUDE_CODING %}
  # Coding workspaces (CODING_WORKSPACE_DOCKER_NETWORK): coderd, Forgejo and
  # the API, none of the data services.
  coding:
    driver: bridge
  # CI job containers (act-runner-config.yaml): Forgejo only.
  ci:
    driver: bridge
  # coderd and its Docker API.
  coder-docker:
    driver: bridge
    internal: true
{% endif %}
  # The NATS monitoring port, shared by the broker and the engine only: it
  # lists every connection and subscription, and has no login.
  nats-monitor:
    driver: bridge
    internal: true
