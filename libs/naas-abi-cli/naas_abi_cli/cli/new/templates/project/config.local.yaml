{% raw %}
api:
  title: "ABI API"
  description: "API for ABI"
  logo_path: "assets/logo.png"
  favicon_path: "assets/favicon.ico"
  cors_origins:
    - "http://{{ secret.PUBLIC_WEB_HOST }}"
    - "https://{{ secret.PUBLIC_WEB_HOST }}"
    - "http://{{ secret.PUBLIC_API_HOST }}"
    - "https://{{ secret.PUBLIC_API_HOST }}"

global_config:
  # Local by default: models are served by Ollama, so the stack starts with no
  # API keys. Switch to "cloud" when you enable a cloud provider module below.
  ai_mode: "local"
  public_api_host: "{{ secret.PUBLIC_API_HOST }}"

opencode:
  auth_file_path: "~/.local/share/opencode/auth.json"
  # No providers by default — the coding agent needs a cloud model, and listing
  # one here would make the project prompt for an API key on first boot.
  #
  # To enable one: add its key to .env, uncomment the block, and replace
  # SECRET_REF with a Jinja secret reference for that variable (see the README
  # section "Using a cloud model instead" for the exact snippet — it cannot be
  # written here, because this file is Jinja-rendered before it is parsed as
  # YAML, so even a commented-out reference would be resolved and prompt).
  #
  # providers:
  #   - id: "openrouter"
  #     key: "SECRET_REF"
  #     type: "api"
  #   - id: "openai"
  #     key: "SECRET_REF"
  #     type: "api"
  providers: []

modules:
  - module: naas_abi
    enabled: true
    config:
      # AbiAgent and OntologyEngineerAgent bind tools, and Phi-3.5 (the default
      # chat model) is completion-only in Ollama — so they point at Llama 3.2,
      # which advertises tool calling. Both default to "claude-sonnet-5"
      # upstream; leaving that would fail at boot with no cloud module enabled.
      abi_agent_model: "llama-3.2"
      ontology_engineer_model: "llama-3.2"
      nexus_config:
        frontend_url: "https://{{ secret.PUBLIC_WEB_HOST }}"
        database_url: "postgresql+asyncpg://{{ secret.POSTGRES_USER }}:{{ secret.POSTGRES_PASSWORD }}@postgres:5432/nexus"
{% endraw %}        feature_flags:
          # The in-app coding workspaces (IDE + git/review, the "code" section)
          # are gated by this feature flag. This project was generated
          # {% if include_coding %}WITH{% else %}WITHOUT{% endif %} the coding stack, so "code" is
          # {% if include_coding %}enabled for workspace admins (owner + admin){% else %}left off for every role{% endif %} below.
          # To change it, add/remove "code" in enabled_features AND the relevant
          # role_baseline roles (members/viewers are intentionally left without it).
          enabled_features:
            - chat
            - files
            - agents
            - apps
            - marketplace
            - search
            - ontology
            - graph
            - settings
{% if include_coding %}            - code
{% endif %}          role_baseline:
            # owner + admin are the workspace admins; they get "code" by default
            # when this project is generated with the coding stack.
            owner: [chat, files, agents, apps, marketplace, search, ontology, graph, settings{% if include_coding %}, code{% endif %}]
            admin: [chat, files, agents, apps, marketplace, search, ontology, graph, settings{% if include_coding %}, code{% endif %}]
            member: [chat, files]
            viewer: [chat, files]
          workspace_overrides: {}
{% raw %}        # Enable password login by default so first sign-in works without an SMTP
        # setup (magic-link email). Configure SMTP + set this false to require it.
        auth_password_enabled: true
        magic_link_allow_signup: false
        magic_link_email_app_name: "ABI Platform"
        magic_link_email_subject_template: "Your {app_name} sign-in link"
        magic_link_email_text_template: "Use this link to sign in to {app_name}:\n\n{magic_link_url}\n\nThis link expires in {expire_minutes} minutes."
        magic_link_email_html_template: "<p>Use this link to sign in to {app_name}:</p><p><a href=\"{magic_link_url}\">Sign in</a></p><p>This link expires in {expire_minutes} minutes.</p>"
        tenant:
          tab_title: "ABI AI Platform"
          primary_color: "#34D399"
          accent_color: "#34D399"
          background_color: "#FFFFFF"
          login_card_color: "#FFFFFF"
          login_input_color: "#F4F4F4"
          login_border_radius: "0"
          show_terms_footer: false
          show_powered_by: false
          login_footer_text: "© ABI AI Platform"
        users:
          - email: "admin@example.com"
            name: "ABI Admin"
        organizations:
          - name: "ABI"
            slug: "abi"
            owner_email: "admin@example.com"
            primary_color: "#34D399"
            accent_color: "#34D399"
            login_footer_text: "© ABI"
            show_powered_by: false
            members:
              - email: "admin@example.com"
                role: "owner"
            workspaces:
              - name: "ABI"
                slug: "abi"
                owner_email: "admin@example.com"
                primary_color: "#34D399"
                accent_color: "#34D399"
                members:
                  - email: "admin@example.com"
                    role: "owner"

  # Local models via Ollama — the only AI provider enabled by default, so the
  # stack boots with zero credentials.
  #
  # Prerequisite on the Docker host (one time):
  #   ollama pull phi3.5 && ollama pull nomic-embed-text && ollama pull llama3.2
  #
  # Ollama runs on the host, not in the stack, so the container reaches it via
  # host.docker.internal (compose maps that to host-gateway for Linux Docker).
  # docker-compose.yml sets ABI_OLLAMA_BASE_URL, which this default mirrors.
  - module: naas_abi_marketplace.ai.ollama
    enabled: true
    config:
      base_url: "http://host.docker.internal:11434"

  # Cloud providers are opt-in. To switch: add the key to .env, uncomment the
  # block, replace SECRET_REF as the README describes, set global_config.ai_mode
  # to "cloud", and update the model_registry defaults below.
  #
  # - module: naas_abi_marketplace.ai.chatgpt
  #   enabled: true
  #   config:
  #     openai_api_key: "SECRET_REF"
  #
  # - module: naas_abi_marketplace.ai.openrouter
  #   enabled: true
  #   config:
  #     openrouter_api_key: "SECRET_REF"
{% endraw %}
  - module: {{ project_name_snake }}
    enabled: true

default_agent: "{{ project_name_snake }} {{ project_name_pascal }}Agent"

{% raw %}
services:
  # Default models for the in-memory model registry, both served locally by the
  # naas_abi_marketplace.ai.ollama module: Phi-3.5 for chat and
  # nomic-embed-text for embeddings. The values are the models' canonical ids,
  # so agents with no explicit model fall back to these.
  #
  # These are validated after modules load — if a default can't be resolved the
  # engine fails fast, so keep them in step with the enabled modules above.
  # Cloud equivalents, once you enable those modules:
  #   default_chat_model: "claude-opus-4.8"        # ai.openrouter
  #   default_embedding_model: "text-embedding-3-large"  # ai.chatgpt
  model_registry:
    default_chat_model: "phi-3.5"
    default_embedding_model: "nomic-embed-text"
  secret:
    secret_adapters:
      - adapter: "dotenv"
        config: {}
  object_storage:
    object_storage_adapter:
      adapter: "s3"
      config:
        bucket_name: "abi"
        base_prefix: "abi/datastore"
        access_key_id: "{{ secret.MINIO_ROOT_USER }}"
        secret_access_key: "{{ secret.MINIO_ROOT_PASSWORD }}"
        endpoint_url: "http://minio:9000"
  triple_store:
    triple_store_adapter:
      adapter: "apache_jena_tdb2"
      config:
        jena_tdb2_url: "http://admin:{{ secret.FUSEKI_ADMIN_PASSWORD }}@fuseki:3030/ds"
        key_value_service:
          kv_adapter:
            adapter: "redis"
            config:
              redis_url: "redis://redis:6379"
  vector_store:
    vector_store_adapter:
      adapter: "qdrant"
      config:
        host: "qdrant"
        port: 6333
  bus:
    bus_adapter:
      adapter: "rabbitmq"
      config:
        rabbitmq_url: "amqp://{{ secret.RABBITMQ_USER }}:{{ secret.RABBITMQ_PASSWORD }}@rabbitmq:5672"
  kv:
    kv_adapter:
      adapter: "redis"
      config:
        redis_url: "redis://redis:6379"
  email:
    email_adapter:
      adapter: "filesystem"
      config:
        directory: "storage/email"
{% endraw %}
