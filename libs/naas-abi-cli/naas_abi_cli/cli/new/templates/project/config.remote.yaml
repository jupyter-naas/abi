{% raw %}
api:
  title: "ABI API"
  description: "API for ABI"
  logo_path: "assets/logo.png"
  favicon_path: "assets/favicon.ico"
  cors_origins:
    - "http://{{ secret.PUBLIC_WEB_HOST }}"
    - "https://{{ secret.PUBLIC_WEB_HOST }}"
    - "http://{{ secret.PUBLIC_API_HOST }}"
    - "https://{{ secret.PUBLIC_API_HOST }}"

global_config:
  # Cloud by default: models are served through the OpenRouter gateway, so a
  # single OPENROUTER_API_KEY covers chat, agents and embeddings — and the
  # remote host needs no inference hardware of its own.
  ai_mode: "cloud"
  public_api_host: "{{ secret.PUBLIC_API_HOST }}"
{% endraw %}{% if nats %}
# NATS mode. The broker runs next to the deployment; put its URLs in
# .env.remote, logged in as the broker users `engine` and `auth`:
#   NATS_URL=nats://engine:<NATS_ENGINE_PASSWORD>@<host>:4222
#   NATS_AUTH_URL=nats://auth:<NATS_AUTH_PASSWORD>@<host>:4222
# and NATS_AUTH_CALLOUT_SEED, the account seed whose public key the broker's
# nats.conf names as auth_callout issuer. Keep the broker on a private
# network: its traffic is not encrypted.
nats:
  nats_url: "{% raw %}{{ secret.NATS_URL }}{% endraw %}"
  auth_callout:
    nats_url: "{% raw %}{{ secret.NATS_AUTH_URL }}{% endraw %}"
    issuer_seed: "{% raw %}{{ secret.NATS_AUTH_CALLOUT_SEED }}{% endraw %}"
  # Exactly one engine per project hosts the module registry. Give any other
  # engine a config without this block.
  discovery:
    project: "{{ project_name_snake }}"
    lease_seconds: 180
  # monitoring_url: "http://<host>:8222"  # the broker's monitoring port (no auth)

# The built-in identity provider (naas-abi-idp): users sign in with a code
# emailed to them. It runs as a module over NATS (run `naas_abi_idp` next to the engine, with its own service key); Nexus serves it at
# /idp on the API host, and the engine reads it through NATS. Its client secret
# is generated into .env.
identity:
  default_provider: builtin
  providers:
    - name: builtin
      display_name: "Email code"
      issuer: "{% raw %}{{ secret.NEXUS_API_URL }}{% endraw %}/idp"
      client_id: abi
      client_secret: "{% raw %}{{ secret.ABI_IDP_CLIENT_SECRET }}{% endraw %}"
      groups_claim: groups
      scopes: [openid, email, profile, groups, offline_access]
      provisioning: builtin
{% endif %}{% raw %}
opencode:
  auth_file_path: "~/.local/share/opencode/auth.json"
  # The coding agent reuses the same gateway key as the rest of the stack.
  providers:
    - id: "openrouter"
      key: "{{ secret.OPENROUTER_API_KEY }}"
      type: "api"

modules:
  - module: naas_abi
    enabled: true
    config:
      # AbiAgent and OntologyEngineerAgent bind tools. Both default to
      # "claude-sonnet-5" upstream, which the openrouter module does not
      # register, so they are pinned to the project default — Gemma 4 supports
      # tool calling, so one model covers chat and agents alike.
      abi_agent_model: "gemma-4-26b-a4b-it"
      ontology_engineer_model: "gemma-4-26b-a4b-it"
      nexus_config:
        database_url: "postgresql+asyncpg://{{ secret.POSTGRES_USER }}:{{ secret.POSTGRES_PASSWORD }}@{{ secret.POSTGRES_HOST }}:{{ secret.POSTGRES_PORT }}/nexus"
        # Nexus has no login of its own: people sign in at an identity provider
        # (`identity.providers`; the built-in one emails a sign-in code).

  # OpenRouter — the only AI provider enabled by default. One gateway key
  # serves both the default chat model (Gemma 4 26B-A4B) and the default
  # embedding model (text-embedding-3-small). For a hosted deployment serving
  # many users this is usually the right trade: no inference hardware to run,
  # and one credential to rotate. Get a key at https://openrouter.ai/keys and
  # put it in .env.remote as OPENROUTER_API_KEY.
  - module: naas_abi_marketplace.ai.openrouter
    enabled: true
    config:
      openrouter_api_key: "{{ secret.OPENROUTER_API_KEY }}"

  # Local models via Ollama are opt-in. A remote host needs an Ollama server
  # reachable from the app: run one alongside it and point ABI_OLLAMA_BASE_URL
  # (or `base_url` below) at it, e.g. http://ollama:11434 on the same network.
  # Then set global_config.ai_mode to "local" and point the model_registry
  # defaults below at "qwen-2.5-3b" / "nomic-embed-text". Install the extra with
  # `uv add "naas-abi-marketplace[ai-ollama]"`.
  #
  # - module: naas_abi_marketplace.ai.ollama
  #   enabled: true
  #
  # Other cloud providers work the same way. Add the key to .env.remote,
  # uncomment the block, and replace SECRET_REF with a Jinja secret reference
  # for that variable (it cannot be written here, because this file is
  # Jinja-rendered before it is parsed as YAML, so even a commented-out
  # reference would be resolved and prompt).
  #
  # - module: naas_abi_marketplace.ai.chatgpt
  #   enabled: true
  #   config:
  #     openai_api_key: "SECRET_REF"
{% endraw %}
  - module: {{ project_name_snake }}
    enabled: true

default_agent: "{{ project_name_snake }} {{ project_name_pascal }}Agent"

{% raw %}
services:
  # Who may do what. Policies are
  # enforced: "authorizer: allow_all" is an explicit opt-out that warns at boot.
  # Reuse the existing database, with a dedicated IAM schema.
  iam:
    store:
      adapter: "postgres"
      dsn: "postgresql://{{ secret.POSTGRES_USER }}:{{ secret.POSTGRES_PASSWORD }}@{{ secret.POSTGRES_HOST }}:{{ secret.POSTGRES_PORT }}/{{ secret.POSTGRES_DB }}"
      schema: "abi_iam"
    authorizer: "policy"
  document:
    document_adapter:
      adapter: "postgresql"
      config:
        dsn: "postgresql://{{ secret.POSTGRES_USER }}:{{ secret.POSTGRES_PASSWORD }}@{{ secret.POSTGRES_HOST }}:{{ secret.POSTGRES_PORT }}/{{ secret.POSTGRES_DB }}"
  # Default models for the in-memory model registry, both served by the
  # naas_abi_marketplace.ai.openrouter module: Gemma 4 26B-A4B for chat and
  # text-embedding-3-small for embeddings — a cheap pairing that still supports
  # tool calling and a 262k context. The values are the models' canonical ids,
  # so agents with no explicit model fall back to these.
  #
  # These are validated after modules load — if a default can't be resolved the
  # engine fails fast, so keep them in step with the enabled modules above.
  # Alternatives, once the matching module is enabled:
  #   default_chat_model: "gemma-4-31b-it"   # ai.openrouter, dense, stronger
  #   default_chat_model: "claude-opus-4.8"  # ai.openrouter, frontier, pricier
  #   default_chat_model: "qwen-2.5-3b"      # ai.ollama, local
  #   default_embedding_model: "nomic-embed-text"  # ai.ollama, local
  model_registry:
    default_chat_model: "gemma-4-26b-a4b-it"
    default_embedding_model: "text-embedding-3-small"
  secret:
    secret_adapters:
      - adapter: "dotenv"
        config:
          - path: .env.remote
  object_storage:
    object_storage_adapter:
      adapter: "s3"
      config:
        bucket_name: "abi"
        base_prefix: "abi/datastore"
        access_key_id: "{{ secret.MINIO_ROOT_USER }}"
        secret_access_key: "{{ secret.MINIO_ROOT_PASSWORD }}"
        endpoint_url: "http://{{ secret.MINIO_HOST }}:{{ secret.MINIO_PORT }}"
  triple_store:
    triple_store_adapter:
      adapter: "apache_jena_tdb2"
      config:
        jena_tdb2_url: "http://admin:{{ secret.FUSEKI_ADMIN_PASSWORD }}@{{ secret.FUSEKI_HOST }}:{{ secret.FUSEKI_PORT }}/ds"
  vector_store:
    vector_store_adapter:
      adapter: "qdrant"
      config:
        host: "{{ secret.QDRANT_HOST }}"
        port: "{{ secret.QDRANT_PORT }}"
{% endraw %}{% if not nats %}{% raw %}
  bus:
    bus_adapter:
      adapter: "rabbitmq"
      config:
        rabbitmq_url: "amqp://{{ secret.RABBITMQ_USER }}:{{ secret.RABBITMQ_PASSWORD }}@{{ secret.RABBITMQ_HOST }}:{{ secret.RABBITMQ_PORT }}"
{% endraw %}{% endif %}{% raw %}
  kv:
    kv_adapter:
      adapter: "redis"
      config:
        redis_url: "redis://{{ secret.REDIS_HOST }}:{{ secret.REDIS_PORT }}"
{% endraw %}
