[project]
name = "naas-abi-marketplace-modules"
version = "0.1.0"
description = "Marketplace application modules as remote ABI modules: each runs in its own process and reaches the engine over NATS, with naas-abi-sdk only."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT License" }
# Never naas-abi-core, naas-abi or naas-abi-marketplace: the Dockerfile and each
# module's tests/module_test.py fail if one of them is imported.
dependencies = [
    "naas-abi-proto>=0.1.0",
    "naas-abi-sdk[agent,otel,workflows,rdf]>=0.2.0",
]

[project.optional-dependencies]
# One extra per application: its own third-party dependencies.
agicap = ["httpx>=0.27,<1"]
algolia = ["algoliasearch>=4.35,<5"]
exchangeratesapi = ["httpx>=0.27,<1"]
# No third-party dependency: the agent answers from its intents.
nebari = []
pennylane = ["httpx>=0.27,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]
sec-gov = ["httpx>=0.27,<1"]
sendgrid = ["httpx>=0.27,<1"]
yahoofinance = ["yfinance==0.2.66", "yahooquery==2.4.1", "pandas>=2"]
all = ["naas-abi-marketplace-modules[agicap,algolia,exchangeratesapi,nebari,pennylane,postgres,sec-gov,sendgrid,yahoofinance]"]

[dependency-groups]
dev = ["pytest>=8", "ruff", "httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# naas_abi_apps is a namespace package: one subpackage per application.
packages = ["naas_abi_apps"]

[tool.uv.sources]
naas-abi-proto = { path = "../naas-abi-proto", editable = true }
naas-abi-sdk = { path = "../naas-abi-sdk", editable = true }

[tool.pytest.ini_options]
testpaths = ["naas_abi_apps"]
python_files = ["*_test.py", "test_*.py"]
addopts = "--import-mode=importlib"
