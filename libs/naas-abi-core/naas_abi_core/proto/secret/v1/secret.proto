// NATS-RPC contract for the secret kernel domain.
// Mirrors naas_abi_core/services/secret/SecretPorts.py's ISecretAdapter 1:1.
// See docs/specs/rfcs/20260910_distributed-modules-nats-jetstream.md.
//
// Security note: Stage 1's shared-JWT auth has no per-caller authorization,
// so any holder of a valid service token can read/write/list every secret
// served here -- an accepted, temporary Stage 1 gap (see
// secret_nats_contract.py's docstring), not an oversight.
//
// `get`'s `default` parameter is deliberately NOT part of the wire
// contract: GetResponse just reports whether the key was found, and the
// client applies its caller's `default` locally when it wasn't -- avoids
// needing to serialize an arbitrary Python `Any` default value.
//
// Subjects:
//   abi.svc.secret.v1.get
//   abi.svc.secret.v1.set
//   abi.svc.secret.v1.remove
//   abi.svc.secret.v1.list
syntax = "proto3";

package abi.secret.v1;

import "naas_abi_core/proto/common/v1/common.proto";

message GetRequest {
  abi.common.v1.CallContext context = 1;
  string key = 2;
}
message GetResult {
  // Unset (not merely empty-string) means "key not found" -- HasField is
  // the real signal, mirroring dotenv's own str | None value semantics.
  optional string value = 1;
}
message GetResponse {
  oneof result {
    GetResult found = 1;
    abi.common.v1.CallError error = 2;
  }
}

message SetRequest {
  abi.common.v1.CallContext context = 1;
  string key = 2;
  string value = 3;
}
message SetResponse {
  optional abi.common.v1.CallError error = 1;
}

message RemoveRequest {
  abi.common.v1.CallContext context = 1;
  string key = 2;
}
message RemoveResponse {
  optional abi.common.v1.CallError error = 1;
}

message ListRequest {
  abi.common.v1.CallContext context = 1;
}
// A repeated list of entries, not a bare `map<string, string>`: the port's
// `list() -> dict[str, str | None]` allows a `None` value (e.g. a
// dotenv-style `KEY=` line with nothing after the `=`), which a plain
// string-valued map can't represent -- `optional string value` here plays
// the same HasField role as on GetResult.
message SecretEntry {
  string key = 1;
  optional string value = 2;
}
message ListResult {
  repeated SecretEntry entries = 1;
}
message ListResponse {
  oneof result {
    ListResult found = 1;
    abi.common.v1.CallError error = 2;
  }
}
