// NATS-RPC contract for the source_control kernel domain.
// Mirrors naas_abi_core/services/source_control/SourceControlPorts.py 1:1 for
// the ISourceControlAdapter surface. See
// docs/specs/rfcs/20260910_distributed-modules-nats-jetstream.md.
//
// Scope of this v1 contract: every ISourceControlAdapter method is plain
// request/response (no streaming/callback members on this port), so all 27
// methods are included here.
//
// A primary adapter serving this contract wraps the SourceControlService
// domain object (not a bare ISourceControlAdapter), so create_proposal,
// submit_review and merge publish the same ProposalOpened/ReviewSubmitted/
// ProposalMerged/ProposalMergeBlocked events for remote callers that they do
// for in-process callers -- see source_control__primary_adapter__NATS.py.
//
// Subjects (see "Protobuf contract shapes" in the RFC):
//   abi.svc.source_control.v1.ensure_user
//   abi.svc.source_control.v1.ensure_repo
//   abi.svc.source_control.v1.list_repos
//   abi.svc.source_control.v1.add_collaborator
//   abi.svc.source_control.v1.list_contents
//   abi.svc.source_control.v1.get_file
//   abi.svc.source_control.v1.upsert_file
//   abi.svc.source_control.v1.upsert_files
//   abi.svc.source_control.v1.list_commits
//   abi.svc.source_control.v1.list_branches
//   abi.svc.source_control.v1.create_branch
//   abi.svc.source_control.v1.delete_branch
//   abi.svc.source_control.v1.get_diff
//   abi.svc.source_control.v1.create_proposal
//   abi.svc.source_control.v1.list_proposals
//   abi.svc.source_control.v1.get_proposal
//   abi.svc.source_control.v1.get_proposal_diff
//   abi.svc.source_control.v1.list_proposal_commits
//   abi.svc.source_control.v1.list_comments
//   abi.svc.source_control.v1.list_reviews
//   abi.svc.source_control.v1.add_comment
//   abi.svc.source_control.v1.submit_review
//   abi.svc.source_control.v1.list_checks
//   abi.svc.source_control.v1.set_branch_protection
//   abi.svc.source_control.v1.merge
//   abi.svc.source_control.v1.list_workflow_runs
//   abi.svc.source_control.v1.mint_git_token
syntax = "proto3";

package abi.source_control.v1;

import "naas_abi_core/proto/common/v1/common.proto";

// ---------------------------------------------------------------------------
// DTOs -- mirror the @dataclass(frozen=True) types in SourceControlPorts.py.
// ---------------------------------------------------------------------------

message Repo {
  string id = 1;
  string name = 2;
  string owner = 3;
  string default_branch = 4;
  string clone_url = 5;
  string html_url = 6;
  string description = 7;
  bool private = 8;
  bool empty = 9;
  optional string updated_at = 10;
}

// One entry in a repository directory listing.
message ContentEntry {
  string name = 1;
  string path = 2;
  string type = 3;  // "file" | "dir"
  int64 size = 4;
}

// FileContent.text/.data are both optional, distinguished together with
// is_binary: a text file carries text (data unset), a binary file carries
// data (text unset).
message FileContent {
  string path = 1;
  string name = 2;
  int64 size = 3;
  optional string text = 4;
  bool is_binary = 5;
  optional bytes data = 6;
}

// One path to create or replace in a tree write. content is UTF-8 text or
// raw bytes for binary assets -- the client picks the oneof arm based on
// isinstance(content, bytes).
message FileWrite {
  string path = 1;
  oneof content {
    string text_content = 2;
    bytes binary_content = 3;
  }
}

message Commit {
  string sha = 1;
  string message = 2;
  string author = 3;
  optional string date = 4;
}

message Branch {
  string name = 1;
  string commit_sha = 2;
  bool protected = 3;
}

message DiffFile {
  string path = 1;
  string status = 2;
  int32 additions = 3;
  int32 deletions = 4;
  optional string patch = 5;
  optional string old_path = 6;
}

message Diff {
  repeated DiffFile files = 1;
}

message Comment {
  string id = 1;
  optional string path = 2;
  optional int32 line = 3;
  string body = 4;
  string author = 5;
  optional string created_at = 6;
}

message Review {
  string id = 1;
  string state = 2;  // one of REVIEW_*
  string body = 3;
  string author = 4;
  optional string submitted_at = 5;
}

message Check {
  string name = 1;
  string status = 2;  // one of CHECK_*
  optional string conclusion = 3;
}

// A normalized pull/merge request ("change proposal").
message Proposal {
  string id = 1;
  int32 number = 2;
  string title = 3;
  string body = 4;
  string state = 5;  // one of PROPOSAL_*
  string source_branch = 6;
  string target_branch = 7;
  string author = 8;
  bool mergeable = 9;
  int32 approvals = 10;
  string html_url = 11;
}

// A CI/CD workflow run (Forgejo/Gitea Actions, GitHub Actions, ...). status
// carries the forge's run status verbatim.
message WorkflowRun {
  int64 id = 1;
  string name = 2;
  string workflow_id = 3;
  string display_title = 4;
  int32 run_number = 5;
  string event = 6;  // push | pull_request | ...
  string status = 7;
  string head_branch = 8;
  string head_sha = 9;
  string url = 10;
  optional string created_at = 11;
  optional string run_started_at = 12;
  optional string updated_at = 13;
}

message MergeResult {
  bool merged = 1;
  optional string sha = 2;
  optional string message = 3;
}

// Repeated-DTO wrappers -- oneof arms can't carry `repeated` directly.
message Repos {
  repeated Repo repos = 1;
}
message ContentEntries {
  repeated ContentEntry entries = 1;
}
message Commits {
  repeated Commit commits = 1;
}
message Branches {
  repeated Branch branches = 1;
}
message Proposals {
  repeated Proposal proposals = 1;
}
message Comments {
  repeated Comment comments = 1;
}
message Reviews {
  repeated Review reviews = 1;
}
message Checks {
  repeated Check checks = 1;
}
message WorkflowRuns {
  repeated WorkflowRun workflow_runs = 1;
}

// ---------------------------------------------------------------------------
// ensure_user
// ---------------------------------------------------------------------------

message EnsureUserRequest {
  abi.common.v1.CallContext context = 1;
  string external_id = 2;
  string email = 3;
  string username = 4;
}
message EnsureUserResponse {
