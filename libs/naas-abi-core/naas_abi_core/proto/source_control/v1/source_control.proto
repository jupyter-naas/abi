// ---------------------------------------------------------------------------

message UpsertFileRequest {
  abi.common.v1.CallContext context = 1;
  string repo_id = 2;
  string path = 3;
  oneof content {
    string text_content = 4;
    bytes binary_content = 5;
  }
  string message = 6;
  string branch = 7;
  optional string author_name = 8;
  optional string author_email = 9;
}
message UpsertFileResponse {
  oneof result {
    Commit commit = 1;
    abi.common.v1.CallError error = 2;
  }
}

