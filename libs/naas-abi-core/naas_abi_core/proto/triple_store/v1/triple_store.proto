// NATS-RPC contract for the triple_store kernel domain.
// Mirrors naas_abi_core/services/triple_store/TripleStorePorts.py::ITripleStorePort 1:1 --
// the adapter-level secondary port (11 methods). It deliberately does NOT cover the richer
// ITripleStoreService (subscribe/load_schema/get_schema_graph): those are domain-only,
// never crossed by a secondary adapter, and stay 100% local.
// See docs/specs/rfcs/20260910_distributed-modules-nats-jetstream.md.
//
// Wire-encoding decisions, deliberate, do not relitigate without re-reading the RFC:
//
//  * Graph <-> bytes: N-Triples specifically (`graph.serialize(format="nt",
//    encoding="utf-8")` / `Graph().parse(data=..., format="nt")`) -- unambiguous, no
//    prefix-resolution issues, unlike Turtle.
//  * URIRef <-> plain `string`: `str(uri)` / `URIRef(the_string)`.
//  * `graph_name: URIRef | str` (get_subject_graph) -> always sent/received as `string`.
//    Reconstructed as `URIRef(s)` server-side, EXCEPT the literal wildcard sentinel `"*"`,
//    which several adapters (e.g. TripleStoreService__SecondaryAdaptor__OxigraphEmbedded)
//    compare with plain `==` against the bare string `"*"` -- `URIRef("*") == "*"` is
//    actually False (rdflib's Identifier.__eq__ requires the other side be a compatible
//    Identifier too), so blindly wrapping would silently break the wildcard. The one
//    literal `"*"` is kept as a plain str; every other value becomes a real URIRef.
//  * `query`/`query_view` returning `rdflib.query.Result`: materialized eagerly into
//    `QueryResult`, which covers all four SPARQL result shapes rdflib itself supports
//    (SELECT/ASK/CONSTRUCT/DESCRIBE) uniformly -- see QueryResult below for why (some
//    ITripleStorePort adapters, e.g. ApacheJenaTDB2/OxigraphEmbedded, actually hand back a
//    bare bool or a bare Graph instead of a properly-typed Result for ASK/CONSTRUCT; the
//    primary adapter normalizes all of those into this one shape).
//  * Each SELECT row's bound values are written with rdflib's own N3 term syntax
//    (`Term.n3()`), not `str()` -- so the client can parse them back with
//    `rdflib.util.from_n3()` and recover a real, correctly-typed URIRef/Literal(+datatype
//    or +lang)/BNode, not a string that lost that identity. Real callers depend on this
//    (e.g. naas_abi.apps.nexus's GraphQueryTripleStoreAdapter.select does
//    `isinstance(term, URIRef)` on a bound term). A variable left unbound by an OPTIONAL is
//    simply absent from `Row.bindings`, matching how `rdflib.query.ResultRow.get()` already
//    treats a missing key.
//  * `Exceptions.RequestError`'s structured fields (operation/status_code/response_body/
//    endpoint/attempts) are carried on a dedicated `TripleStoreRequestErrorDetail`, attached
//    alongside `abi.common.v1.CallError` on every response that can raise it, so a client
//    reconstructs the exact exception rather than losing those fields into free text.
//
// Subjects (see "Protobuf contract shapes" in the RFC):
//   abi.svc.triple_store.v1.insert
//   abi.svc.triple_store.v1.remove
//   abi.svc.triple_store.v1.get
//   abi.svc.triple_store.v1.handle_view_event
//   abi.svc.triple_store.v1.query
//   abi.svc.triple_store.v1.query_view
//   abi.svc.triple_store.v1.get_subject_graph
//   abi.svc.triple_store.v1.create_graph
//   abi.svc.triple_store.v1.clear_graph
//   abi.svc.triple_store.v1.drop_graph
//   abi.svc.triple_store.v1.list_graphs
syntax = "proto3";

package abi.triple_store.v1;

import "naas_abi_core/proto/common/v1/common.proto";

// Structured detail for Exceptions.RequestError -- service-specific (not shared on
// common.proto) since only HTTP-backed triple_store adapters raise it today.
message TripleStoreRequestErrorDetail {
  string operation = 1;
  optional int32 status_code = 2;
  optional string response_body = 3;
  optional string endpoint = 4;
  optional int32 attempts = 5;
}

enum OntologyEventType {
  ONTOLOGY_EVENT_TYPE_UNSPECIFIED = 0;
  ONTOLOGY_EVENT_TYPE_INSERT = 1;
  ONTOLOGY_EVENT_TYPE_DELETE = 2;
}

// A subject/predicate/object pattern where each position is optional -- unset means the
// wildcard `None` on ITripleStorePort.handle_view_event's tuple positions. Reused for both
// the `view` and `triple` parameters, which share this exact shape.
message TriplePattern {
  optional string subject = 1;
  optional string predicate = 2;
  optional string object = 3;
}

message InsertRequest {
  abi.common.v1.CallContext context = 1;
  bytes triples_nt = 2;
  string graph_name = 3;
}
message InsertResponse {
  optional abi.common.v1.CallError error = 1;
  optional TripleStoreRequestErrorDetail error_detail = 2;
}

message RemoveRequest {
  abi.common.v1.CallContext context = 1;
  bytes triples_nt = 2;
  string graph_name = 3;
}
message RemoveResponse {
  optional abi.common.v1.CallError error = 1;
  optional TripleStoreRequestErrorDetail error_detail = 2;
}

message GetRequest {
  abi.common.v1.CallContext context = 1;
}
message GetResponse {
  oneof result {
    bytes triples_nt = 1;
    abi.common.v1.CallError error = 2;
  }
  optional TripleStoreRequestErrorDetail error_detail = 3;
}

message HandleViewEventRequest {
  abi.common.v1.CallContext context = 1;
  TriplePattern view = 2;
  OntologyEventType event = 3;
  TriplePattern triple = 4;
}
message HandleViewEventResponse {
  optional abi.common.v1.CallError error = 1;
  optional TripleStoreRequestErrorDetail error_detail = 2;
}

message QueryRequest {
  abi.common.v1.CallContext context = 1;
  string query = 2;
}
message QueryResponse {
  oneof result {
    QueryResult success = 1;
    abi.common.v1.CallError error = 2;
  }
  optional TripleStoreRequestErrorDetail error_detail = 3;
}

message QueryViewRequest {
  abi.common.v1.CallContext context = 1;
  string view = 2;
  string query = 3;
}
message QueryViewResponse {
  oneof result {
    QueryResult success = 1;
    abi.common.v1.CallError error = 2;
  }
  optional TripleStoreRequestErrorDetail error_detail = 3;
}

// Wire shape for an eagerly-materialized rdflib.query.Result, covering all four SPARQL
// result forms rdflib itself distinguishes (Result.type: "SELECT"/"ASK"/"CONSTRUCT"/
// "DESCRIBE") uniformly, since ITripleStorePort.query/query_view can produce any of them
// depending on the query and the backing adapter.
message QueryResult {
  // rdflib's own Result.type, carried verbatim so the client reconstructs a
  // `rdflib.query.Result` of the exact original type instead of a lossy stand-in.
  string result_type = 1;
  oneof payload {
    SelectResult select = 2;
    bool ask_answer = 3;
    // N-Triples-encoded graph, for CONSTRUCT/DESCRIBE result types.
    bytes construct_triples_nt = 4;
  }
}

message SelectResult {
  repeated string vars = 1;
  repeated Row rows = 2;
}

// One SPARQL solution row: variable name -> its bound value written in rdflib N3 term
// syntax (see the file header comment for why, not a bare string). A variable left unbound
// by an OPTIONAL has no entry here.
message Row {
  map<string, string> bindings = 1;
}

message GetSubjectGraphRequest {
  abi.common.v1.CallContext context = 1;
  string subject = 2;
  string graph_name = 3;
}
message GetSubjectGraphResponse {
  oneof result {
    bytes triples_nt = 1;
    abi.common.v1.CallError error = 2;
  }
  optional TripleStoreRequestErrorDetail error_detail = 3;
}

message CreateGraphRequest {
  abi.common.v1.CallContext context = 1;
  string graph_name = 2;
}
message CreateGraphResponse {
  optional abi.common.v1.CallError error = 1;
  optional TripleStoreRequestErrorDetail error_detail = 2;
}

message ClearGraphRequest {
  abi.common.v1.CallContext context = 1;
  string graph_name = 2;
}
message ClearGraphResponse {
  optional abi.common.v1.CallError error = 1;
  optional TripleStoreRequestErrorDetail error_detail = 2;
}

message DropGraphRequest {
  abi.common.v1.CallContext context = 1;
  string graph_name = 2;
}
message DropGraphResponse {
  optional abi.common.v1.CallError error = 1;
  optional TripleStoreRequestErrorDetail error_detail = 2;
}

message ListGraphsRequest {
  abi.common.v1.CallContext context = 1;
}
message ListGraphsResponse {
  oneof result {
    GraphNames graph_names = 1;
    abi.common.v1.CallError error = 2;
  }
  optional TripleStoreRequestErrorDetail error_detail = 3;
}
message GraphNames {
  repeated string graph_names = 1;
}
