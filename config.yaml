deploy:
  workspace_id: "96ce7ee7-e5f5-4bca-acf9-9d5d41317f81"
  space_name: "abi-api"
  naas_api_key: "{{ secret.NAAS_API_KEY }}"
  env:
    NAAS_API_KEY: "{{ secret.NAAS_API_KEY }}"
    OPENAI_API_KEY: "{{ secret.OPENAI_API_KEY }}"
    ABI_API_KEY: "{{ secret.ABI_API_KEY }}"

api:
  title: "ABI API"
  description: "API for ABI"
  logo_path: "assets/logo.png"
  favicon_path: "assets/favicon.ico"
  cors_origins:
    - "http://localhost:9879"
    - "http://localhost:3042"

global_config:
  ai_mode: "cloud"
  public_api_host: "{{ secret.NEXUS_API_URL }}"

# NATS mode: kernel services, the bus (JetStream), module jobs and discovery go
# through the broker, and remote modules run in their own process. `abi dev up`
# starts its own nats-server and overlays the URL, password and monitoring port
# it bound (.abi/dev/dev.overlay.yaml); these values fit an engine run outside
# `abi dev` (`abi chat`, `make api`) against the Docker stack's broker
# (`abi stack start`). The broker passwords and the callout seed are generated
# into .env on first run.
# `abi dev up --without-nats` runs the legacy in-process engine instead.
nats:
  # The broker user `engine`, and the auth callout the engine answers as `auth`:
  # every other connection (modules) is admitted by the engine with the subjects
  # its approved permission manifest allows.
  nats_url: "nats://engine:{{ secret.NATS_ENGINE_PASSWORD }}@127.0.0.1:4222"
  auth_callout:
    nats_url: "nats://auth:{{ secret.NATS_AUTH_PASSWORD }}@127.0.0.1:4222"
    issuer_seed: "{{ secret.NATS_AUTH_CALLOUT_SEED }}"
  # One engine per project hosts the module registry: this one.
  discovery:
    project: "abi"
    # Outlives an engine restart: remote modules renew instead of dropping
    # out. A crashed module stays listed up to this long; a clean stop
    # (SIGTERM) unregisters at once.
    lease_seconds: 180
  # The broker's HTTP monitoring port, read by the Nexus System app. No auth.
  monitoring_url: "http://127.0.0.1:8222"

opencode:
  auth_file_path: "~/.local/share/opencode/auth.json"
  providers:
    - id: "openrouter"
      key: "{{ secret.OPENROUTER_API_KEY }}"
      type: "api"
    - id: "openai"
      key: "{{ secret.OPENAI_API_KEY }}"
      type: "api"

default_agent: naas_abi AbiAgent 
modules:
  - module: naas_abi
    enabled: true
    config:
      # AbiAgent, PlatformServicesAgent, OntologyEngineerAgent, etc. default to
      # claude-sonnet-5 upstream; pin to an OpenAI model registered by chatgpt.
      abi_agent_model: "gpt-4.1-mini"
      abi_agent_provider: "openai"
      ontology_engineer_model: "gpt-4.1-mini"
      ontology_engineer_provider: "openai"
      nexus_config:
        database_url: "sqlite+aiosqlite:///./storage/nexus.db"
        # Nexus has no login of its own: people sign in at an identity provider
        # (`identity.providers`; `abi dev up` runs the built-in one, which mails a
        # code, and `abi dev code` prints it). The `users:` below are made at the
        # provider when the API starts, and keep the roles configured here.
        tenant:
          tab_title: "ABI"
          # Social sharing preview - shown when the platform URL is shared in
          # Slack, Twitter/X, iMessage, LinkedIn, etc.
          og_title: "ABI"
          og_description: "Your AI Operating System - agents, knowledge, and data in one place."
          og_image_url: "https://repository-images.githubusercontent.com/704324955/444d3ad8-befb-446f-9723-6453aad2c336"
        feature_flags:
          enabled_features:
            - maps
            - chat
            - files
            - agents
            - skills
            - apps
            - marketplace
            - search
            - ontology
            - graph
            - datasets
            - settings
            - slides
            - documents
            - code
          role_baseline:
            owner: [maps, chat, files, agents, skills, apps, marketplace, search, ontology, graph, datasets, settings, slides, documents, code]
            admin: [maps, chat, files, agents, skills, apps, marketplace, search, ontology, graph, datasets, settings, slides, documents, code]
            member: [maps, chat, files, datasets, skills, slides, documents, code]
            viewer: [maps, chat, files, datasets, skills, slides, documents]
          workspace_overrides: {}
        marketplace:
          pricing:
            maintenance_standard_usd: 499
            maintenance_early_access_usd: 299
            cta_url: "https://naas.ai/enterprise"
            enterprise_categories: ["domain"]
        users:
          - email: "admin@example.com"
            name: "Dev Admin"
            is_superadmin: true
        organizations:
          - name: "Dev"
            slug: "dev"
            owner_email: "admin@example.com"
            workspaces:
              - name: "Default"
                slug: "default"
                owner_email: "admin@example.com"
              - name: "Alpha"
                slug: "alpha"
                owner_email: "admin@example.com"
              - name: "Beta"
                slug: "beta"
                owner_email: "admin@example.com"
              - name: "Gamma"
                slug: "gamma"
                owner_email: "admin@example.com"
  
  - module: naas_abi_marketplace.ai.chatgpt
    enabled: true
    config:
      openai_api_key: "{{ secret.OPENAI_API_KEY }}"

  - module: naas_abi_marketplace.ai.openrouter
    enabled: true
    config:
      openrouter_api_key: "{{ secret.OPENROUTER_API_KEY }}"

  # WSR alpha module — not shipped in this checkout (naas_abi_marketplace.alpha)
  # - module: naas_abi_marketplace.alpha.wsr
  #   enabled: true
  #   config:
  #     opensky_client_id: "{{ secret.OPENSKY_CLIENT_ID }}"
  #     opensky_client_secret: "{{ secret.OPENSKY_CLIENT_SECRET }}"
  #     tfl_app_key: "{{ secret.TFL_APP_KEY }}"
  #     openwebcamdb_api_key: "{{ secret.OPENWEBCAMDB_API_KEY }}"

  - module: naas_abi_marketplace.applications.git
    enabled: true
  
  - module: naas_abi_marketplace.applications.github
    enabled: true
    config:
      github_access_token: "{{ secret.GITHUB_ACCESS_TOKEN }}"

  - module: naas_abi_marketplace.applications.sec_gov
    enabled: true
    config:
      datastore_path: "sec_gov"
      user_agent: "NAAS-ABI-Marketplace/1.0 (abi@naas.ai)"

  # X (Twitter) integration — requires X_BEARER_TOKEN in .env
  # - module: naas_abi_marketplace.applications.x
  #   enabled: true
  #   config:
  #     bearer_token: "{{ secret.X_BEARER_TOKEN }}"
  
  - module: naas_abi_marketplace.domains.operations.modules.document
    enabled: true
    config:
      document_agent:
        model_id: "text-embedding-3-small"
        dimension: 1536
        api_key: "{{ secret.OPENAI_API_KEY }}"
      markdowntovector_pipelines:
        - api_key: "{{ secret.OPENAI_API_KEY }}"

  - module: naas_abi_marketplace.domains.operations.modules.ontology_engineer
    enabled: true
    config:
      datastore_path: "ontology-engineer"

  - module: naas_abi_marketplace.domains.operations.modules.support
    enabled: true
    config:
        default_repository: "jupyter-naas/abi"
        github_project_id: 12
        project_node_id: "PVT_kwDOBESWNM4AKRt3"
        iteration_field_id: "PVTIF_lADOBESWNM4AKRt3zgGZRc4"
        status_field_id: "PVTSSF_lADOBESWNM4AKRt3zgGZRV8"
        status_option_id: "97363483"
        priority_field_id: "PVTSSF_lADOBESWNM4AKRt3zgGac0g"
        priority_option_id: "4fb76f2d"
  
services:
  # Who may do what (identity and authorization RFC 20261013): SQLite here.
  # Policies are enforced; "authorizer: allow_all" is an explicit opt-out
  # that warns at boot.
  iam:
    store:
      adapter: "sqlite"
      path: "storage/iam/iam.sqlite"
    authorizer: "policy"

  # ModelRegistry defaults. Auto-resolved against models registered by the
  # enabled provider modules at boot — if the canonical id below isn't
  # registered after all modules load, ``Engine.load()`` hard-fails.
  model_registry:
    default_chat_model: "gpt-4.1-mini"
    default_embedding_model: "text-embedding-3-large"
  secret:
    secret_adapters:
      - adapter: "dotenv"
        config: {}
  object_storage:
    object_storage_adapter:
      adapter: "fs"
      config:
        base_path: "storage/datastore"
  document:
    document_adapter:
      adapter: "sqlite"
      config:
        path: "storage/documents.sqlite"
  dataset:
    dataset_adapter:
      adapter: "ducklake"
      config:
        catalog: "sqlite:storage/datasets.sqlite"
        data_path: "storage/datasets/"
  triple_store:
    triple_store_adapter:
      # Default to the HTTP-backed oxigraph adapter so multiple processes
      # (api + dagster + …) can share the store concurrently. `abi dev`
      # spawns a local oxigraph server (see naas_abi_core.services
      # .triple_store.oxigraph_server) and injects OXIGRAPH_URL into each
      # consumer's environment, which overrides this value.
      adapter: "oxigraph"
      config:
        oxigraph_url: "http://127.0.0.1:7878"
        timeout: 60
  vector_store:
    # File-backed SQLite + sqlite-vec store. Multi-process safe via WAL,
    # so api and dagster can share it without a server. For prod, switch
    # to the "qdrant" HTTP adapter (see config.local.yaml / config.remote.yaml).
    vector_store_adapter:
      adapter: "sqlite_vec"
      config:
        persistence_path: "storage/vectorstore/vectors.sqlite3"
        journal_mode: "WAL"
        busy_timeout_ms: 5000
  # No `bus:` block: in NATS mode the bus is JetStream on the broker above.
  # Without NATS (`abi dev up --without-nats`) the engine falls back to the
  # SQLite-backed "python_queue" bus in storage/bus/.
  kv:
    kv_adapter:
      adapter: "python"
      config:
        persistence_path: "storage/kv/python.sqlite3"
        journal_mode: "WAL"
        busy_timeout_ms: 5000
  email:
    email_adapter:
      adapter: "filesystem"
      config:
        directory: "storage/email"
  event:
    event_adapter:
      adapter: "sqlite"
      config:
        db_path: "storage/events/events.sqlite"
  source_control:
    source_control_adapter:
      adapter: "local_git"
      config:
        repos_root: "storage/git"
  coding_environment:
    coding_environment_adapter:
      adapter: "local_directory"
      config:
        workspaces_root: "storage/workspaces"
        harness: "opencode"
        opencode_bin: "opencode"
        harness_port_start: 18200
        harness_port_end: 18300
        opencode_model: "openai/gpt-5.4"
        opencode_startup_timeout: 30
